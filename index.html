銀行（民間金融機関）である。"}, {"id": "c5_s11", "page": "p.74", "number": 11, "statement": "支払準備率が5%なら、信用創造によって預金総額は、最初の預金額の最大5倍まで増える。", "answer": false, "explanation": "誤り。預金総額は最初の預金額の 1÷0.05＝20倍 まで増える。"}, {"id": "c5_s12", "page": "p.74", "number": 12, "statement": "支払準備率が10%なら、5,000万円の預金は信用創造によって新たに4億5,000万円のお金を作り出すことができる。", "answer": true, "explanation": "正しい。預金総額は5,000万÷0.1＝5億円。新たに創出される信用創造額は 5億円－5,000万円＝4億5,000万円。"}, {"id": "c5_s13", "page": "p.74", "number": 13, "statement": "当座預金は預金通貨の一つであり、小切手を振り出して支払いに使うことができる。", "answer": true, "explanation": "正しい。当座預金は無利息の預金で、小切手や手形を振り出して決済に利用する。"}, {"id": "c5_s14", "page": "p.74", "number": 14, "statement": "利益の社内留保によって調達された資金は、自己資本である。", "answer": true, "explanation": "正しい。企業の内部留保（利益剰余金）は返済義務のない自己資本に分類される。"}, {"id": "c5_s15", "page": "p.75", "number": 1, "statement": "日本銀行が金融政策の指標として重視して管理している通貨流通量をマネーストックという。", "answer": true, "explanation": "正しい。一般企業や個人などの民間が保有する通貨量の残高をマネーストックと呼ぶ。"}, {"id": "c5_s16", "page": "p.75", "number": 2, "statement": "日本銀行の三大機能は、発券銀行、銀行の銀行および国債の引き受けである。", "answer": false, "explanation": "誤り。日銀の三大機能は「発券銀行」「銀行の銀行」「政府の銀行」である（国債の直接引き受けは原則禁止）。"}, {"id": "c5_s17", "page": "p.75", "number": 3, "statement": "現在、日本銀行が政策的に最も重要視している金利は、無担保コールレート（翌日物）と呼ばれる短期金利である。", "answer": true, "explanation": "正しい。伝統的金融政策および短期金利の代表的な誘導目標は無担保コールレート（翌日物）である。"}, {"id": "c5_s18", "page": "p.75", "number": 4, "statement": "現在、日本銀行が最も重要視している金融政策は、金融市場で有価証券を直接売買することによって通貨量を調整する方法である。", "answer": true, "explanation": "正しい。現在の日本銀行の主要な金融政策手段は公開市場操作（オペレーション）である。"}, {"id": "c5_s19", "page": "p.75", "number": 5, "statement": "近年、市中銀行の日本銀行への強制預金割合を上下させて通貨量を調整する金融政策がさかんに行われている。", "answer": false, "explanation": "誤り。預金準備率操作は1991年以降変更されておらず、近年はほとんど使われていない。"}, {"id": "c5_s20", "page": "p.75", "number": 6, "statement": "日本銀行は、2001年に、それまでの大量に資金供給を行う金融緩和政策を改め、金融引き締め策を行った。", "answer": false, "explanation": "誤り。2001年に開始されたのは日本初の「量的緩和政策」であり、一層の金融緩和策である。"}, {"id": "c5_s21", "page": "p.75", "number": 7, "statement": "金利の自由化が進み、公定歩合の重要性が低下したため、現在では日本銀行から市中銀行への貸出金利は、その都度、自由に設定できるようになった。", "answer": false, "explanation": "誤り。日銀の貸出金利（基準割引率および基準貸付利率）は日銀が政策金利として決定・公示する公定金利である。"}, {"id": "c5_s22", "page": "p.75", "number": 8, "statement": "デフレの場合には、売りオペなどにより通貨の流通量を増やす必要がある。", "answer": false, "explanation": "誤り。通貨の流通量を増やすには「買いオペ」を行う（売りオペは通貨量を減らす）。"}, {"id": "c5_s23", "page": "p.75", "number": 9, "statement": "インフレの場合には、コールレートをなるべく低い水準に誘導する必要がある。", "answer": false, "explanation": "誤り。インフレを抑える（引き締め）にはコールレートを「引き上げる」必要がある。"}, {"id": "c5_s24", "page": "p.75", "number": 10, "statement": "バブル景気の時には、低金利が長く続いたこともあり、多くの資金が金融機関から融資されたが、その多くがバブル崩壊後、不良債権化した。", "answer": true, "explanation": "正しい。低金利下で不動産や株式に過剰融資が行われ、バブル崩壊後に巨額の不良債権が発生した。"}, {"id": "c5_s25", "page": "p.75", "number": 11, "statement": "一般に中央銀行は、不況期に市中銀行から国債を買い入れる。", "answer": true, "explanation": "正しい。不況期には買いオペを行い、市中銀行から国債を買い入れて資金を供給する。"}, {"id": "c5_s26", "page": "p.75", "number": 12, "statement": "銀行は、間接金融を行っている点では保険会社と同じであるが、要求払い預金を受け入れているという点で保険会社と異なる。", "answer": true, "explanation": "正しい。銀行は要求払い預金を受け入れ決済機能と信用創造を行う点が他の金融機関と大きく異なる。"}, {"id": "c5_s27", "page": "p.76", "number": 1, "statement": "1990年代後半、経営難に陥った銀行が預金獲得をめざして過度の高金利を設定するのを防ぐため、日本銀行は定期預金の金利規制を強化した。", "answer": false, "explanation": "誤り。1990年代半ばまでに預金金利の自由化は完了しており、金利規制を強化した事実はない。"}, {"id": "c5_s28", "page": "p.76", "number": 2, "statement": "日本では、経営破綻した銀行への預金について元金1,000万円およびその利子を限度として保護するペイオフが、まず普通預金から解禁された。", "answer": false, "explanation": "誤り。ペイオフはまず定期預金（2002年）から解禁され、普通預金等の流動性預金は2005年に解禁された。"}, {"id": "c5_s29", "page": "p.76", "number": 3, "statement": "ノンバンクは預金を受け入れているが、企業や家計に対する貸付けを行わずに株式・会社債の購入を主要な業務としている点で、銀行とは異なる。", "answer": false, "explanation": "誤り。ノンバンクは「預金を受け入れず」、貸付け（融資・ローン）を行う金融業者である。"}, {"id": "c5_s30", "page": "p.76", "number": 4, "statement": "日本で生活する人がドル建てで預金を行っている場合、円安ドル高になれば為替差益が発生することになる。", "answer": true, "explanation": "正しい。ドル建て資産を持っている場合、円安になれば円換算の価値が増加し為替差益を得る。"}, {"id": "c5_s31", "page": "p.76", "number": 5, "statement": "日本銀行の金融政策決定過程の透明性を向上させるため、金融政策決定会合の議事要旨や議事録が公開されるようになった。", "answer": true, "explanation": "正しい。1998年施行の新日本銀行法により、日銀の独立性強化とともに議事要旨等の公開による透明性向上が図られた。"}, {"id": "c5_s32", "page": "p.76", "number": 6, "statement": "日本では、従来、各種の預金金利に対して政府の強い規制が働いていたが、金融自由化によって、個々の銀行は預金金利の設定に大幅な自由が認められることになった。", "answer": true, "explanation": "正しい。1980年代からの金利自由化により、預金金利は各銀行が自由に決定できるようになった。"}, {"id": "c5_s33", "page": "p.76", "number": 7, "statement": "高度経済成長の時期に、フリー（自由）、フェア（公正）、グローバル（国際化）を原則とする金融制度改革が行われた。", "answer": false, "explanation": "誤り。「フリー・フェア・グローバル」を3原則とする日本版金融ビッグバンが行われたのは1990年代後半（橋本内閣）である。"}, {"id": "c5_s34", "page": "p.76", "number": 8, "statement": "金融の自由化の流れの中で、国際業務を行う銀行の自己資本比率に関する国際基準が撤廃された。", "answer": false, "explanation": "誤り。自己資本比率の国際基準（BIS規制）は撤廃されたのではなく、むしろ健全性確保のため強化されている。"}, {"id": "c5_s35", "page": "p.76", "number": 9, "statement": "銀行が、BIS規制や不良債権処理の影響で、融資に消極的になることを「貸し渋り」という。", "answer": true, "explanation": "正しい。自己資本比率を維持するためにリスク資産である貸出を圧縮・抑制することを「貸し渋り」「貸し剥がし」という。"}, {"id": "c5_s36", "page": "p.76", "number": 10, "statement": "日本では、金融自由化による銀行間の過当競争を抑えようというねらいから、金融監督庁の設置を始めとして、大蔵省の権限の強化が図られた。", "answer": false, "explanation": "誤り。大蔵省の過剰な権限集中や接待汚職事件を背景に、大蔵省から金融行政を分離して金融監督庁（現・金融庁）が新設され、大蔵省の権限は解体・縮小された。"}]}, {"id": "cat6", "title": "財政とその役割 / 租税と日本の財政の課題", "page_range": "p.77〜79", "questions": [{"id": "c6_q1", "number": 1, "theme": "日本の財政（予算）", "source": "政経, 倫理・政経本試", "question_text": "日本の予算に関する記述として正しいものを、次の①〜④のうちから一つ選べ。", "options": ["特別会計の予算は、特定の事業を行う場合や特定の資金を管理・運用する場合に、一般会計の予算とは区別して作成される。", "国の予算の一つである政府関係機関予算については、国会に提出して、その承認を受ける必要はないとされている。", "財政投融資の見直しが行われ、現在では郵便貯金や年金の積立金は一括して国に預託され、運用されるようになっている。", "補正予算とは、当初予算案の国会審議の最中に、その当初予算案に追加や変更がなされた予算のことである。"], "correct_answer": 1, "explanation": "正解：①\n①正しい 年金や食料安定供給、エネルギー対策、東日本大震災復興などの特別会計がある。特定の事業や資金の経理を一般会計と区分して行う。\n②誤り 政府関係機関予算や財政投融資計画についても国会に提出され、予算と同様に国会の議決・承認が必要である。\n③誤り 2001年の財投改革により、郵便貯金や年金積立金の全額義務預託は廃止され、財投機関債や財投債を発行して市場から資金調達する方式に改められた。\n④誤り 補正予算とは、本予算が成立した「後」に生じた事由（災害復旧、経済対策等）に対応するため、当初予算に追加・変更を加える予算のことである（国会審議中の変更は修正予算案）。"}, {"id": "c6_q2", "number": 2, "theme": "日本の租税制度", "source": "公共追試", "question_text": "日本の租税制度に関する記述として最も適当なものを、次の①〜④のうちから一つ選べ。", "options": ["生活必需品に対して消費税の税率を低くすることで、高所得者の消費税負担額を変えずに低所得者の消費税負担額を減らすことができる。", "生産活動のために財・サービスを仕入れたり購入したりする企業は、消費税を国に納付しない。", "公共サービスを多く利用する者は、所得が同一であっても所得税をより多く負担する。", "会社員に対して給与を支払う者は、法令にしたがって所得税を徴収してその所得税を国に納入する。"], "correct_answer": 4, "explanation": "正解：④\n④適当 会社員の給与に対する所得税は、会社が給料から天引きして国に納付する「源泉徴収制度」がとられている。\n①不適当 軽減税率は生活必需品の購入額が同じであれば高所得者も同額負担が減るため、高所得者の負担額も減る。\n②不適当 企業も売上に係る消費税から仕入れに係る消費税を差し引いた差額を国に申告・納付する。\n③不適当 所得税は応能負担の原則に基づき課税されるため、公共サービスの利用頻度によって税額が変わることはない。"}, {"id": "c6_q3", "number": 3, "theme": "日本の財政", "source": "政経本試", "question_text": "次のA〜Dは、日本の財政をめぐる出来事についての記述である。これらの出来事を古い順に並べたとき、3番目にくるものとして正しいものを、次の①〜④のうちから一つ選べ。\n\nA 税率3パーセントの消費税が導入された。\nB 国と地方との関係が見直され、地方分権一括法が施行された。\nC 直接税中心の税体系を提唱したシャウプ勧告が行われた。\nD 第二次世界大戦後初めて、赤字国債（特例国債）が発行された。", "options": ["A", "B", "C", "D"], "correct_answer": 1, "explanation": "正解：①\n各出来事の年代は以下の通り：\nC: シャウプ勧告（1949年）\nD: 第二次大戦後初の赤字国債発行（1965年度補正予算、昭和40年不況対策）\nA: 消費税3%導入（1989年、竹下登内閣）\nB: 地方分権一括法施行（2000年）\n古い順に並べると C → D → A → B となり、3番目にくるのは A（1989年消費税導入）である。"}, {"id": "c6_q4", "number": 4, "theme": "公共事業・減税", "source": "政経, 倫理・政経追試", "question_text": "日本における公共事業や減税に関する記述として最も適当なものを、次の①〜④のうちから一つ選べ。", "options": ["地方消費税の税率が3パーセントから2パーセントに引き下げられた。", "道路・河川の整備・改修などの公共事業の経費の一部を国が負担する制度として、共済制度がある。", "財政法は原則として国債発行を禁止しているが、公共事業費、出資金、貸付金などに充てる国債の発行を認めている。", "所得税の累進課税が進展課税に改められた。"], "correct_answer": 3, "explanation": "正解：③\n③適当 財政法第4条但し書きにより、公共事業費、出資金、貸付金の財源に充てるための国債（建設国債／4条国債）の発行が例外的に認められている。\n①不適当 地方消費税は消費税率引き上げに伴い引き上げられており、引き下げられたことはない。\n②不適当 国が地方の公共事業経費の一部を負担する制度は「国庫支出金（国庫補助金・負担金）」である。\n④不適当 所得税の累進課税は緩和（フラット化）が進められてきたが、「進展課税」なる制度に改められた事実はない。"}, {"id": "c6_q5", "number": 5, "theme": "財政の役割", "source": "現社本試", "question_text": "政府の役割に関する記述として最も適当なものを、次の①〜④のうちから一つ選べ。", "options": ["政府が行う環境政策の対象は、環境汚染に伴う経済的損失のうち、市場取引を通じて発生するものに限られる。", "公共事業の拡大は、景気の変動を自動的に和らげるビルトイン・スタビライザーと呼ばれる機能を有している。", "財源の一つである消費税の税率が引き上げられると、租税収入に占める直接税の割合は、大きくなる。", "民間企業だけでは供給が不十分となりがちになる公共財を、政府が供給する場合、その働きは資源配分機能である。"], "correct_answer": 4, "explanation": "正解：④\n④適当 市場メカニズムでは十分に供給されない公共財（警察、消防、道路等）を政府が供給することは、財政の「資源配分機能」に当たる。\n①不適当 公害等の環境問題は市場を通さない「外部不経済」であり、政府の環境政策は市場外の損失にも広く対応する。\n②不適当 公共事業の拡大は政府の裁量的な判断で行われる「フィスカル・ポリシー（裁量的財政政策）」である。\n③不適当 消費税は間接税なので、消費税増税により租税収入に占める間接税の割合が大きくなり、直接税の割合は小さくなる。"}, {"id": "c6_q6", "number": 6, "theme": "財政と予算", "source": "現社本試", "question_text": "日本の財政や予算に関する記述として最も適当なものを、次の①〜④のうちから一つ選べ。", "options": ["政府支出や税収の増減を通じて、民間部門の需要を刺激あるいは抑制し、景気の安定化を図る手法をフィスカル・ポリシーと呼ぶ。", "国会で成立させる予算のうち、国が行う特定事業の収支を計上したものを財政投融資と呼ぶ。", "地方財政に関して、地方公共団体の自主財源に含まれるものには、地方税のほかに地方交付税がある。", "地方分権に関わる「三位一体の改革」の一環で、補助金（国庫支出金）の増額が図られた。"], "correct_answer": 1, "explanation": "正解：①\n①適当 政府が予算や税制を通じて総需要をコントロールし景気の安定化を図る政策をフィスカル・ポリシー（裁量的財政政策）と呼ぶ。\n②不適当 特定事業の収支を計上した予算は「特別会計予算」である。\n③不適当 地方交付税は国税として徴収され地方に配分される「依存財源」である（自主財源は地方税、分担金、使用料等）。\n④不適当 三位一体の改革では国庫補助負担金の「削減（約4兆円）」、税源移譲、地方交付税の見直しが行われた。"}, {"id": "c6_q7", "number": 7, "theme": "財政政策", "source": "政経, 倫理・政経追試", "question_text": "財政政策についての記述として正しいものを、次の①〜④のうちから一つ選べ。", "options": ["政府が財政政策の手段として税の増減と公共支出の増減とをあわせて用いることを、ポリシー・ミックスという。", "政府による建設国債以外の国債の発行を原則として禁止することを、財政の硬直化という。", "政府は好景気のときには財政支出を増加させ、不景気のときには財政支出を減少させることで、経済を安定させようとする。", "政府は好景気のときには増税し、不景気のときには減税することで、経済を安定させようとする。"], "correct_answer": 4, "explanation": "正解：④\n④正しい 好景気で景気過熱やインフレが懸念される時には増税で総需要を抑制し、不景気には減税で総需要を拡大させる。\n①誤り ポリシー・ミックスとは、財政政策と金融政策など性格の異なる複数の政策手段を組み合わせて同時に運用すること。\n②誤り 財政の硬直化とは、過去に発行した国債の元利払い（国債費）などが膨らみ、新規の政策的経費に充てる予算の自由度が失われること。\n③誤り 好景気には財政支出を削減し、不景気には公共事業等の財政支出を拡大させる。"}, {"id": "c6_q8", "number": 8, "theme": "一般会計", "source": "政経, 倫理・政経追試", "question_text": "次の図は日本における国の一般会計歳出の内訳（公共事業関係費、国債費、社会保障関係費、地方交付税交付金等、その他）を示している。図中のA〜Cに当てはまる歳出項目の組合せとして正しいものを、次の①〜⑥のうちから一つ選べ。", "material": {"type": "chart_breakdown", "content": "<div class=\"my-2 p-3 bg-slate-50 border rounded text-xs text-slate-800\">\n  <div class=\"font-bold text-center mb-2\">【一般会計歳出の内訳の推移 (1960年〜2010年度)】</div>\n  <table class=\"w-full text-center border-collapse border border-slate-300 bg-white\">\n    <tr class=\"bg-slate-100\">\n      <th class=\"border border-slate-300 p-1\">年度</th>\n      <th class=\"border border-slate-300 p-1\">その他</th>\n      <th class=\"border border-slate-300 p-1\">地方交付税等</th>\n      <th class=\"border border-slate-300 p-1 font-bold text-blue-600\">[ C ]</th>\n      <th class=\"border border-slate-300 p-1 font-bold text-rose-600\">[ B ]</th>\n      <th class=\"border border-slate-300 p-1 font-bold text-emerald-600\">[ A ]</th>\n    </tr>\n    <tr>\n      <td class=\"border border-slate-300 p-1 font-semibold\">1960</td>\n      <td class=\"border border-slate-300 p-1\">51.2%</td>\n      <td class=\"border border-slate-300 p-1\">15.0%</td>\n      <td class=\"border border-slate-300 p-1\">13.1%</td>\n      <td class=\"border border-slate-300 p-1\">3.5%</td>\n      <td class=\"border border-slate-300 p-1\">17.2%</td>\n    </tr>\n    <tr>\n      <td class=\"border border-slate-300 p-1 font-semibold\">1970</td>\n      <td class=\"border border-slate-300 p-1\">43.2%</td>\n      <td class=\"border border-slate-300 p-1\">17.2%</td>\n      <td class=\"border border-slate-300 p-1\">17.6%</td>\n      <td class=\"border border-slate-300 p-1\">3.5%</td>\n      <td class=\"border border-slate-300 p-1\">18.5%</td>\n    </tr>\n    <tr>\n      <td class=\"border border-slate-300 p-1 font-semibold\">1980</td>\n      <td class=\"border border-slate-300 p-1\">36.6%</td>\n      <td class=\"border border-slate-300 p-1\">15.9%</td>\n      <td class=\"border border-slate-300 p-1\">15.9%</td>\n      <td class=\"border border-slate-300 p-1\">12.5%</td>\n      <td class=\"border border-slate-300 p-1\">19.1%</td>\n    </tr>\n    <tr>\n      <td class=\"border border-slate-300 p-1 font-semibold\">1990</td>\n      <td class=\"border border-slate-300 p-1\">29.7%</td>\n      <td class=\"border border-slate-300 p-1\">23.0%</td>\n      <td class=\"border border-slate-300 p-1\">10.0%</td>\n      <td class=\"border border-slate-300 p-1\">16.6%</td>\n      <td class=\"border border-slate-300 p-1\">20.7%</td>\n    </tr>\n    <tr>\n      <td class=\"border border-slate-300 p-1 font-semibold\">2000</td>\n      <td class=\"border border-slate-300 p-1\">25.2%</td>\n      <td class=\"border border-slate-300 p-1\">17.7%</td>\n      <td class=\"border border-slate-300 p-1\">10.0%</td>\n      <td class=\"border border-slate-300 p-1\">19.7%</td>\n      <td class=\"border border-slate-300 p-1\">27.4%</td>\n    </tr>\n    <tr class=\"bg-amber-50\">\n      <td class=\"border border-slate-300 p-1 font-semibold\">2010</td>\n      <td class=\"border border-slate-300 p-1\">22.9%</td>\n      <td class=\"border border-slate-300 p-1\">18.9%</td>\n      <td class=\"border border-slate-300 p-1 text-red-600 font-bold\">6.3% (激減)</td>\n      <td class=\"border border-slate-300 p-1 text-blue-600 font-bold\">29.5% (激増)</td>\n      <td class=\"border border-slate-300 p-1 text-emerald-600 font-bold\">22.4% (最大)</td>\n    </tr>\n  </table>\n  <div class=\"text-[10px] text-slate-500 mt-1\">(資料) 財務省「日本の財政関係資料」により作成。</div>\n</div>"}, "options": ["A-公共事業関係費　B-国債費　C-社会保障関係費", "A-公共事業関係費　B-社会保障関係費　C-国債費", "A-国債費　B-公共事業関係費　C-社会保障関係費", "A-国債費　B-社会保障関係費　C-公共事業関係費", "A-社会保障関係費　B-公共事業関係費　C-国債費", "A-社会保障関係費　B-国債費　C-公共事業関係費"], "correct_answer": 6, "explanation": "正解：⑥\nA…高齢社会の進展に伴い1960年以降一貫して増加し、2010年には歳出の約30%（最大項目）を占めるようになったのが「社会保障関係費」。\nB…国債の大量発行に伴い、特に1980年代以降劇的に増えてきたのが国債の元利払いにあたる「国債費」。\nC…1980年までは歳出の15%以上を占めていたが、財政難や公共投資削減により10%を割り込み激減したのが「公共事業関係費」。\nよって A-社会保障関係費、B-国債費、C-公共事業関係費（⑥）。"}, {"id": "c6_q9", "number": 9, "theme": "国債", "source": "政経, 倫理・政経追試", "question_text": "財政状況に関連する記述として最も適当なものを、次の①〜④のうちから一つ選べ。", "options": ["2000年度以降、日本では国債が発行されなかった年度がある。", "2000年度以降、日本では国債依存度が50パーセントを上回る年度はない。", "国債費の膨張が社会保障や教育などに充てる経費を圧迫することを、財政の硬直化という。", "国債費を除いた歳出が国債発行収入を除いた税収などの歳入を上回ると、基礎的財政収支は黒字となる。"], "correct_answer": 3, "explanation": "正解：③\n③適当 国債費の増大によって政策的経費（社会保障・教育・科学技術等）に回せる財源が制約されることを「財政の硬直化」という。\n①不適当 1965年度以降、国債が発行されなかった年度はない。\n②不適当 リーマン・ショック後の2009年度当初予算・補正後において、公債依存度は50%を超えた。\n④不適当 歳出が税収等の歳入を上回る状態は「基礎的財政収支の赤字」である。"}, {"id": "c6_q10", "number": 10, "theme": "公債依存度とプライマリー・バランス", "source": "政経, 倫理・政経本試", "question_text": "次の表は、日本における国の一般会計の歳出と歳入との推移を示したものである。この表から読みとれる内容として正しいものを、次の①〜④のうちから一つ選べ。", "material": {"type": "table_html", "content": "<div class=\"my-2 max-w-md mx-auto text-xs\">\n  <div class=\"text-right text-slate-500 mb-1\">(単位: 兆円)</div>\n  <table class=\"w-full text-center border-collapse border border-slate-300 bg-white\">\n    <thead>\n      <tr class=\"bg-slate-100\">\n        <th class=\"border border-slate-300 p-1\" colspan=\"2\"></th>\n        <th class=\"border border-slate-300 p-1\">1980年度</th>\n        <th class=\"border border-slate-300 p-1\">1990年度</th>\n        <th class=\"border border-slate-300 p-1\">2000年度</th>\n        <th class=\"border border-slate-300 p-1\">2010年度</th>\n      </tr>\n    </thead>\n    <tbody>\n      <tr>\n        <td class=\"border border-slate-300 p-1 font-semibold\" rowspan=\"2\">歳出</td>\n        <td class=\"border border-slate-300 p-1\">計</td>\n        <td class=\"border border-slate-300 p-1\">43</td>\n        <td class=\"border border-slate-300 p-1\">66</td>\n        <td class=\"border border-slate-300 p-1\">85</td>\n        <td class=\"border border-slate-300 p-1\">92</td>\n      </tr>\n      <tr>\n        <td class=\"border border-slate-300 p-1 text-slate-600\">うち公債費</td>\n        <td class=\"border border-slate-300 p-1\">5</td>\n        <td class=\"border border-slate-300 p-1\">14</td>\n        <td class=\"border border-slate-300 p-1\">22</td>\n        <td class=\"border border-slate-300 p-1\">21</td>\n      </tr>\n      <tr class=\"bg-slate-50\">\n        <td class=\"border border-slate-300 p-1 font-semibold\" rowspan=\"2\">歳入</td>\n        <td class=\"border border-slate-300 p-1\">計</td>\n        <td class=\"border border-slate-300 p-1\">43</td>\n        <td class=\"border border-slate-300 p-1\">66</td>\n        <td class=\"border border-slate-300 p-1\">85</td>\n        <td class=\"border border-slate-300 p-1\">92</td>\n      </tr>\n      <tr class=\"bg-slate-50\">\n        <td class=\"border border-slate-300 p-1 text-slate-600\">うち公債金</td>\n        <td class=\"border border-slate-300 p-1\">14</td>\n        <td class=\"border border-slate-300 p-1\">6</td>\n        <td class=\"border border-slate-300 p-1\">33</td>\n        <td class=\"border border-slate-300 p-1\">44</td>\n      </tr>\n    </tbody>\n  </table>\n  <div class=\"text-[10px] text-slate-500 mt-1\">\n    (注) 数値は当初予算で、小数点以下を四捨五入している。また、公債費とは国債の元利払いを指し、公債金とは国債発行による収入を指す。<br>\n    (資料) 財務省Webページにより作成。\n  </div>\n</div>"}, "options": ["1980年度の公債依存度は20パーセント以下である。", "1990年度の基礎的財政収支（プライマリー・バランス）は黒字である。", "2000年度の基礎的財政収支（プライマリー・バランス）は黒字である。", "2010年度の公債依存度は20パーセント以下である。"], "correct_answer": 2, "explanation": "正解：②\n基礎的財政収支（プライマリー・バランス）は、税収等（歳入－公債金）と一般歳出（歳出－公債費）との差額である。\n1990年度：税収等＝66－6＝60兆円、一般歳出＝66－14＝52兆円。税収等＞一般歳出（60兆円＞52兆円）で＋8兆円の「黒字」となっている。\n①誤り 1980年度の公債依存度＝14÷43≒32.6%（20%超）。\n③誤り 2000年度は税収等52兆円に対し一般歳出63兆円で赤字（－11兆円）。\n④誤り 2010年度の公債依存度＝44÷92≒47.8%（20%超）。"}, {"id": "c6_q11", "number": 11, "theme": "日本の財政状況", "source": "政経本試", "question_text": "日本の財政状況に関する記述として最も適当なものを、次の①〜④のうちから一つ選べ。", "options": ["公共事業などの費用の不足を賄うために、赤字国債を発行することが義務づけられている。", "財政を通じた低所得者への所得再分配が行われており、ポリシー・ミックスと呼ばれている。", "財政支出に占める国債費の割合が増加し、財政が硬直化していると言われている。", "一律の税率で課税される消費税は、低所得者ほど所得に占める税負担が軽くなる。"], "correct_answer": 3, "explanation": "正解：③\n③適当 歳出に占める国債費（元利払い）の割合が高まることで、他の政策的経費が圧迫される現象を「財政の硬直化」という。\n①不適当 公共事業には建設国債が発行され、赤字国債の発行が義務づけられているわけではない。\n②不適当 所得再分配は財政の固有機能であり、ポリシー・ミックスとは財政政策と金融政策の組み合わせのこと。\n④不適当 消費税には「逆進性」があり、低所得者ほど所得に占める税負担割合が重くなる。"}, {"id": "c6_q12", "number": 12, "theme": "日本の財政状況", "source": "現社追試", "question_text": "イトウさんは世代間の公平に関連して取り上げられることの多い財政赤字や累積債務問題にも興味を抱いていた。そこで父に尋ねたところ、父は、「日本の財政の現状を理解するには、その経緯だけでなく財政構造など幅広い知識が必要だよ」とアドバイスしてくれた。財政に関する記述として最も適当なものを、次の①〜④のうちから一つ選べ。", "options": ["政府の歳入の基本である租税を間接税と直接税に分ける場合、消費税は直接税に分類される。", "1990年代後半、日本政府はバブル崩壊後の長引く不況への対策として、一般会計における歳出削減を継続した。", "歳出の多くが公債の元金返済や利息の支払いに使われるようになり、柔軟な財政政策ができなくなることを、財政の硬直化という。", "2010年から現在までの日本国内では、プライマリー・バランスの黒字が続いている。"], "correct_answer": 3, "explanation": "正解：③\n③適当 歳出の多くが公債の元利払いに使われ、柔軟な政策的経費の配分ができなくなることを財政の硬直化という。\n①不適当 消費税は担税者（消費者）と納税者（事業者）が異なる「間接税」である。\n②不適当 1990年代後半には不況対策として大型経済対策が連発され、歳出は拡大傾向にあった。\n④不適当 2010年以降も日本の基礎的財政収支（プライマリー・バランス）は赤字が続いている。"}], "speed_checks": [{"id": "c6_s1", "page": "p.77", "number": 1, "statement": "所得税や消費税など、担税者と納税者が同じ税を直接税という。", "answer": false, "explanation": "誤り。消費税は担税者（消費者）と納税義務者（事業者）が異なる「間接税」である。"}, {"id": "c6_s2", "page": "p.77", "number": 2, "statement": "法人税と固定資産税は、ともに直接税であり、国税である。", "answer": false, "explanation": "誤り。法人税は直接税かつ国税であるが、固定資産税は市町村が課税する地方税（直接税）である。"}, {"id": "c6_s3", "page": "p.77", "number": 3, "statement": "石油等の化石燃料の使用など、環境に負荷をかける活動を抑制する目的で課される税を、総称して環境税という。", "answer": true, "explanation": "正しい。地球温暖化対策税など環境負荷抑制を目的とした租税を環境税と総称する。"}, {"id": "c6_s4", "page": "p.77", "number": 4, "statement": "戦前の日本の税制は間接税が中心であったが、戦後、シャウプ勧告を受け入れ、直接税中心主義を採用した。", "answer": true, "explanation": "正しい。1949年のシャウプ勧告により、所得税・法人税を中心とする直接税中心の税体系が確立した。"}, {"id": "c6_s5", "page": "p.77", "number": 5, "statement": "日本の所得税では、給与所得者、自営業者、農業従事者の間で所得捕捉率に差があり、税負担の不公平の一因とされてきた。", "answer": true, "explanation": "正しい。いわゆる「クロヨン（9・6・4）」や「トーゴーサン（10・5・3）」と呼ばれる所得捕捉率格差問題である。"}, {"id": "c6_s6", "page": "p.77", "number": 6, "statement": "日本では、課税対象額が大きいほど高い税率となる累進課税方式が、所得税などで採用されている。", "answer": true, "explanation": "正しい。所得税や相続税などでは所得の再分配を目的として超過累進税率が採用されている。"}, {"id": "c6_s7", "page": "p.77", "number": 7, "statement": "法人税は、事業規模が大きいほど税率が高くなる累進課税方式で課税される。", "answer": false, "explanation": "誤り。法人税は基本的に比例税率（普通法人は原則23.2%等の一定税率）で課税される（中小法人等の軽減税率はあるが一般的な累進課税ではない）。"}, {"id": "c6_s8", "page": "p.77", "number": 8, "statement": "1990年代には、税負担の累進性の緩和や有効需要の拡大などを目的として、所得税の減税が行われた。", "answer": true, "explanation": "正しい。1990年代には景気対策や活力回復のため特別減税や恒久減税、最高税率の引き下げ等が行われた。"}, {"id": "c6_s9", "page": "p.77", "number": 9, "statement": "租税等に関する情報を、個人一人ひとりに個人番号を付して管理する仕組みとして、マイナンバー制度が導入されている。", "answer": true, "explanation": "正しい。社会保障・税・災害対策の3分野で公平・公正な給付と負担を確保するためマイナンバー制度が導入された。"}, {"id": "c6_s10", "page": "p.77", "number": 10, "statement": "経済のグローバル化を背景に、1990年代後半に法人税率が引き下げられた。", "answer": true, "explanation": "正しい。国際競争力強化や企業立地促進のため、1990年代後半以降法人税率は段階的に引き下げられた。"}, {"id": "c6_s11", "page": "p.77", "number": 11, "statement": "水平公平とは、所得の多い人がより多くの税を負担するという考え方のことである。", "answer": false, "explanation": "誤り。所得の多い人がより多く負担するのは「垂直的公平」である。「水平的公平」は同等の担税力を持つ者は同等の税を負担するという考え方。"}, {"id": "c6_s12", "page": "p.77", "number": 12, "statement": "EU（欧州連合）加盟国の付加価値税（消費税）では、生活必需品の税率を軽減する例がある。", "answer": true, "explanation": "正しい。EU諸国の標準税率は20%前後と高いが、食料品や書籍等に軽減税率やゼロ税率が広く適用されている。"}, {"id": "c6_s13", "page": "p.77", "number": 13, "statement": "相続税の累進性を強化することにより、資産を多く相続する者の税負担が軽減される。", "answer": false, "explanation": "誤り。累進性を強化すれば、資産を多く相続する富裕層の税負担は「重く」なる。"}, {"id": "c6_s14", "page": "p.78", "number": 1, "statement": "あらかじめ財政の仕組みの中に組み込まれた累進課税制度や失業保険や生活保護給付などの社会保障制度が、景気の変動を自動的に調節する機能をビルトイン・スタビライザー（自動安定化装置）という。", "answer": true, "explanation": "正しい。累進課税や社会保障制度による自動的な需要調整機能をビルトイン・スタビライザーという。"}, {"id": "c6_s15", "page": "p.78", "number": 2, "statement": "ビルトイン・スタビライザーに加えて補整的に行われる、景気・インフレ対策としての減税や増税・公共投資の増減といった政策をポリシー・ミックスという。", "answer": false, "explanation": "誤り。意図的に行う補整的な財政政策は「フィスカル・ポリシー（裁量的財政政策）」という。ポリシー・ミックスは財政政策と金融政策の併用。"}, {"id": "c6_s16", "page": "p.78", "number": 3, "statement": "国や地方公共団体は、市場にゆだねておいたのでは十分に供給されない財やサービスを供給する役割を担っている。", "answer": true, "explanation": "正しい。公共財や準公共財（教育、医療、社会インフラ等）の供給は政府の基本的役割である。"}, {"id": "c6_s17", "page": "p.78", "number": 4, "statement": "財政政策は、景気や国際収支の安定等を目的として、金融政策と組み合わせて運用されることがある。", "answer": true, "explanation": "正しい。これを「ポリシー・ミックス」と呼び、マクロ経済の安定化のために不可欠である。"}, {"id": "c6_s18", "page": "p.78", "number": 5, "statement": "1990年代の日本政府の一般会計予算では、財政構造改革の進展により国債の新規発行が抑制されたことから、国債費の歳出に占める割合は著しく低下した。", "answer": false, "explanation": "誤り。1990年代はバブル崩壊後の不況対策で国債発行が急増し、国債費の割合も増大した。"}, {"id": "c6_s19", "page": "p.78", "number": 6, "statement": "1990年代の日本政府の一般会計予算では、年金や医療の財政負担がかさんだことから、社会保障費の歳出に占める割合は著しく増大した。", "answer": true, "explanation": "正しい。少子高齢化の進展に伴い、社会保障関係費は歳出の中で最も大きな割合を占めるまでに増大した。"}, {"id": "c6_s20", "page": "p.78", "number": 7, "statement": "1990年代の日本政府の一般会計予算では、景気対策として公共投資の拡大が続いたことから、公共事業費の歳出に占める割合は90年代後半以降著しく増大した。", "answer": false, "explanation": "誤り。公共事業費は1990年代半ばをピークにその後削減され、歳出に占める割合は著しく低下した。"}, {"id": "c6_s21", "page": "p.78", "number": 8, "statement": "1970年代以降、特例国債（赤字国債）の発行は増加傾向にあるので、日本は純債務国である。", "answer": false, "explanation": "誤り。日本は巨額の財政赤字を抱えるが、対外資産から対外負債を引いた対外純資産は世界最大規模であり、世界最大の「純債権国」である。"}, {"id": "c6_s22", "page": "p.78", "number": 9, "statement": "1990年代以降、公共投資を積極的に行っているので、建設国債の発行額は増え続けている。", "answer": false, "explanation": "誤り。公共事業費の抑制に伴い建設国債の発行額は抑制され、国債増加の主因は特例国債（赤字国債）である。"}, {"id": "c6_s23", "page": "p.78", "number": 10, "statement": "1970年代以降、日本の一般会計歳入額に占める公債発行額の割合が、50%を超えたことはない。", "answer": false, "explanation": "誤り。リーマン・ショック後の2009年度等に公債依存度は50%を超えた。"}, {"id": "c6_s24", "page": "p.79", "number": 1, "statement": "国債の利払い費を抑制して国債費の金額を減らすことは、基礎的財政収支（プライマリー・バランス）の赤字を歳出の面から縮小させる。", "answer": false, "explanation": "誤り。基礎的財政収支（PB）は「国債費（利払い・元本返済）を除いた歳出」を対象とするため、利払い費の削減はPBの計算には直接影響しない。"}, {"id": "c6_s25", "page": "p.79", "number": 2, "statement": "公共事業は将来の世代に社会資本を残すので、公共事業のために国債を発行することは認められている。", "answer": true, "explanation": "正しい。財政法第4条但し書きで認められている建設国債（資産形成型国債）の根拠である。"}, {"id": "c6_s26", "page": "p.79", "number": 3, "statement": "国債の発行は、国債費を増大させ、他の経費にあてうる財源を圧迫することがある。", "answer": true, "explanation": "正しい。国債の元利払いが固定費化し他の予算を制約する「財政の硬直化」である。"}, {"id": "c6_s27", "page": "p.79", "number": 4, "statement": "国債の発行は、金融市場を圧迫し、民間部門の資金調達を妨げる可能性がある。", "answer": true, "explanation": "正しい。国債大量発行により金利が上昇し民間の設備投資を締め出す「クラウディング・アウト」効果のことである。"}, {"id": "c6_s28", "page": "p.79", "number": 5, "statement": "国債の発行は、負担を後の世代に残し、世代間の負担の公平を阻害する、と指摘されることがある。", "answer": true, "explanation": "正しい。将来世代への負担の先送りであり、財政赤字の大きな問題点とされる。"}, {"id": "c6_s29", "page": "p.79", "number": 6, "statement": "財政投融資とは、国や特殊法人・独立行政法人などの財投機関が、その信用によって国民から調達した資金を使って、民間では困難なプロジェクトの実施、サービスの提供、長期資金の提供などを行う活動である。", "answer": true, "explanation": "正しい。国の信用力をもとに調達した資金を政策的な融資や事業に活用する制度である。"}, {"id": "c6_s30", "page": "p.79", "number": 7, "statement": "財政投融資のために調達した資金は、一般会計と違い利子を付けて返さなければならない。", "answer": true, "explanation": "正しい。財投は融資（有償資金）であるため、税金を財源とする一般会計と異なり元利金の返済が必要である。"}, {"id": "c6_s31", "page": "p.79", "number": 8, "statement": "郵便貯金や年金などを財源とする財政投融資は、第二の政府予算と呼ばれるように公共性が高く、その使用目的は社会資本整備に、投融資先は国・地方公共団体に限定されている。", "answer": false, "explanation": "誤り。投融資先は公的機関だけでなく民間企業や独立行政法人など多様であり、限定されていない。"}, {"id": "c6_s32", "page": "p.79", "number": 9, "statement": "財政投融資制度の改革により、簡易保険・郵便貯金や政府の特別会計などの資金を、直接に特殊法人や企業へ融資する仕組みになった。", "answer": false, "explanation": "誤り。2001年の改革により郵貯・年金資金の義務預託は廃止され、財投債発行等による市場調達に改められた。"}, {"id": "c6_s33", "page": "p.79", "number": 10, "statement": "財政投融資の使途は、以前は産業基盤整備向けが多かったが、近年は、住宅や生活基盤向けが多くなってきている。", "answer": true, "explanation": "正しい。戦後復興期の基幹産業向けから、次第に住宅・環境・生活基盤整備へと重点が移行した。"}, {"id": "c6_s34", "page": "p.79", "number": 11, "statement": "公的扶助には、所得再分配機能がある。", "answer": true, "explanation": "正しい。生活保護などの公的扶助は税財源から低所得者に給付を行うため、所得再分配機能を持つ。"}]}];
  </script>

  <!-- Application Logic -->
  <script>
    class SoundManager {
      constructor() {
        this.enabled = true;
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
      }
      playCorrect() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc1 = this.ctx.createOscillator();
          const osc2 = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc1.type = 'sine';
          osc2.type = 'sine';
          osc1.frequency.setValueAtTime(523.25, now);
          osc1.frequency.setValueAtTime(659.25, now + 0.08);
          osc2.frequency.setValueAtTime(1046.50, now + 0.08);

          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(this.ctx.destination);

          osc1.start(now);
          osc2.start(now + 0.08);
          osc1.stop(now + 0.35);
          osc2.stop(now + 0.35);
        } catch (e) {
          console.log(e);
        }
      }
      playWrong() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(196, now);
          osc.frequency.setValueAtTime(146.83, now + 0.12);

          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + 0.35);
        } catch (e) {
          console.log(e);
        }
      }
    }

    class QuizApp {
      constructor() {
        this.data = QUIZ_DATA;
        this.sound = new SoundManager();
        this.storageKey = 'seikei_quiz_history_v2';
        this.history = this.loadHistory();

        // Current Session
        this.currentMode = null; // 'normal', 'speed', 'review', 'all_speed'
        this.currentCatIndex = 0;
        this.sessionQuestions = [];
        this.currentIndex = 0;
        this.userAnswers = {};

        this.initDOM();
        this.setupKeyboardShortcuts();
        this.renderHome();
      }

      loadHistory() {
        try {
          const val = localStorage.getItem(this.storageKey);
          return val ? JSON.parse(val) : { normal: {}, speed: {} };
        } catch (e) {
          return { normal: {}, speed: {} };
        }
      }

      saveHistory() {
        try {
          localStorage.setItem(this.storageKey, JSON.stringify(this.history));
        } catch (e) {}
      }

      openModal(title, message, onConfirm) {
        const modal = document.getElementById('modalContainer');
        document.getElementById('modalTitle').textContent = title;
        document.getElementById('modalMessage').textContent = message;

        const confirmBtn = document.getElementById('modalConfirmBtn');
        const cancelBtn = document.getElementById('modalCancelBtn');

        const cleanup = () => {
          modal.classList.add('hidden');
          confirmBtn.onclick = null;
          cancelBtn.onclick = null;
        };

        confirmBtn.onclick = () => {
          cleanup();
          onConfirm();
        };
        cancelBtn.onclick = cleanup;

        modal.classList.remove('hidden');
      }

      resetAllHistory() {
        this.openModal(
          '学習履歴のリセット',
          'すべての分野の解答記録や正答率をリセットします。この操作は取り消せません。よろしいですか？',
          () => {
            this.history = { normal: {}, speed: {} };
            this.saveHistory();
            this.renderHome();
          }
        );
      }

      resetCurrentCategory(catIdx) {
        const cat = this.data[catIdx];
        this.openModal(
          '分野の学習記録リセット',
          `「${cat.title}」の通常問題およびスピードチェックの学習記録をリセットしますか？`,
          () => {
            cat.questions.forEach(q => delete this.history.normal[q.id]);
            cat.speed_checks.forEach(q => delete this.history.speed[q.id]);
            this.saveHistory();
            this.renderHome();
          }
        );
      }

      initDOM() {
        this.container = document.getElementById('viewContainer');
      }

      setupKeyboardShortcuts() {
        window.addEventListener('keydown', (e) => {
          if (!this.sessionQuestions || this.sessionQuestions.length === 0) return;
          const q = this.sessionQuestions[this.currentIndex];
          if (!q) return;

          // If not answered yet
          if (!this.userAnswers[q.id]) {
            if (q.isSpeed) {
              if (e.key === '1' || e.key.toLowerCase() === 'o') {
                this.submitSpeedAnswer(true);
              } else if (e.key === '2' || e.key.toLowerCase() === 'x') {
                this.submitSpeedAnswer(false);
              }
            } else {
              const num = parseInt(e.key);
              if (num >= 1 && num <= q.options.length) {
                this.submitNormalAnswer(num);
              }
            }
          } else {
            // If already answered, ArrowRight or Enter advances
            if (e.key === 'ArrowRight' || e.key === 'Enter') {
              if (this.currentIndex < this.sessionQuestions.length - 1) {
                this.nextQuestion();
              } else {
                this.finishQuiz();
              }
            } else if (e.key === 'ArrowLeft') {
              this.prevQuestion();
            }
          }
        });
      }

      toggleSound() {
        this.sound.enabled = !this.sound.enabled;
        document.getElementById('soundOnIcon').classList.toggle('hidden', !this.sound.enabled);
        document.getElementById('soundOffIcon').classList.toggle('hidden', this.sound.enabled);
      }

      goHome() {
        this.renderHome();
      }

      getCategoryStats(catIdx) {
        const cat = this.data[catIdx];
        const normalTotal = cat.questions.length;
        const speedTotal = cat.speed_checks.length;

        let normalAnswered = 0, normalCorrect = 0;
        let speedAnswered = 0, speedCorrect = 0;

        cat.questions.forEach(q => {
          if (this.history.normal && this.history.normal[q.id]) {
            normalAnswered++;
            if (this.history.normal[q.id].isCorrect) normalCorrect++;
          }
        });

        cat.speed_checks.forEach(q => {
          if (this.history.speed && this.history.speed[q.id]) {
            speedAnswered++;
            if (this.history.speed[q.id].isCorrect) speedCorrect++;
          }
        });

        return {
          normalTotal, speedTotal,
          normalAnswered, normalCorrect,
          speedAnswered, speedCorrect,
          allTotal: normalTotal + speedTotal,
          allAnswered: normalAnswered + speedAnswered,
          allCorrect: normalCorrect + speedCorrect
        };
      }

      getAllWrongQuestions() {
        const list = [];
        this.data.forEach((cat, catIdx) => {
          cat.questions.forEach(q => {
            if (this.history.normal && this.history.normal[q.id] && !this.history.normal[q.id].isCorrect) {
              list.push({ ...q, categoryTitle: cat.title, isSpeed: false, catIndex: catIdx });
            }
          });
          cat.speed_checks.forEach(q => {
            if (this.history.speed && this.history.speed[q.id] && !this.history.speed[q.id].isCorrect) {
              list.push({ ...q, categoryTitle: cat.title, isSpeed: true, catIndex: catIdx });
            }
          });
        });
        return list;
      }

      renderHome() {
        const wrongList = this.getAllWrongQuestions();

        let totalQuestions = 0;
        let totalAnswered = 0;
        let totalCorrect = 0;

        this.data.forEach((_, idx) => {

      startQuiz(mode, catIndex) {
        this.currentMode = mode;
        this.currentCatIndex = catIndex;
        const cat = this.data[catIndex];

        if (mode === 'normal') {
          this.sessionQuestions = cat.questions.map(q => ({
            ...q,
            isSpeed: false,
            categoryTitle: cat.title
          }));
        } else {
          this.sessionQuestions = cat.speed_checks.map(q => ({
            ...q,
            isSpeed: true,
            categoryTitle: cat.title
          }));
        }

        this.currentIndex = 0;
        this.userAnswers = {};
        this.renderQuizQuestion();
      }

      startAllSpeedCheck() {
        this.currentMode = 'all_speed';
        this.sessionQuestions = [];
        this.data.forEach(cat => {
          cat.speed_checks.forEach(q => {
            this.sessionQuestions.push({
              ...q,
              isSpeed: true,
              categoryTitle: cat.title
            });
          });
        });
        this.currentIndex = 0;
        this.userAnswers = {};
        this.renderQuizQuestion();
      }

      startReviewMode() {
        const wrongList = this.getAllWrongQuestions();
        if (wrongList.length === 0) return;

        this.currentMode = 'review';
        this.sessionQuestions = [...wrongList];
        this.currentIndex = 0;
        this.userAnswers = {};
        this.renderQuizQuestion();
      }

      renderQuizQuestion() {
        const q = this.sessionQuestions[this.currentIndex];
        const total = this.sessionQuestions.length;
        const currentAns = this.userAnswers[q.id];
        const isAnswered = !!currentAns;

        let modeBadge = '';
        if (this.currentMode === 'normal') {
          modeBadge = `<span class="bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded text-[11px] font-bold">通常問題</span>`;

                    ${q.material.type === 'memo' || q.material.type === 'note' || q.material.type === 'statements' ? `
                      <div class="p-3 sm:p-4 rounded-xl bg-slate-50 border border-slate-200 text-xs sm:text-sm text-slate-800 whitespace-pre-wrap leading-relaxed">

              <div class="mt-6 pt-4 border-t border-slate-100">
        `;

        if (q.isSpeed) {
          const trueSelected = isAnswered && currentAns.selected === true;
          const falseSelected = isAnswered && currentAns.selected === false;
          const trueIsCorrect = q.answer === true;

          let trueStyle = "bg-white hover:bg-slate-50 text-slate-800 border-slate-300";
          let falseStyle = "bg-white hover:bg-slate-50 text-slate-800 border-slate-300";

          if (isAnswered) {
            if (trueIsCorrect) {
              trueStyle = "bg-emerald-50 text-emerald-800 border-emerald-500 ring-2 ring-emerald-400 font-black";
            }
            if (!trueIsCorrect) {
              falseStyle = "bg-emerald-50 text-emerald-800 border-emerald-500 ring-2 ring-emerald-400 font-black";
            }
            if (trueSelected && !trueIsCorrect) {
              trueStyle = "bg-rose-50 text-rose-800 border-rose-500 line-through";

            if (falseSelected && trueIsCorrect) {
              falseStyle = "bg-rose-50 text-rose-800 border-rose-500 line-through";

          html += `

            const isCorrectOption = optNum === q.correct_answer;

                  ${optNum}
                </span>
                <span class="flex-1 leading-relaxed">${opt}</span>
              </button>

          html += `

              <div class="flex items-center gap-2 font-black text-sm sm:text-base mb-2">

                  <span class="w-6 h-6 rounded-full bg-emerald-500 text-white flex items-center justify-center text-xs">✓</span>

                  <span class="w-6 h-6 rounded-full bg-rose-500 text-white flex items-center justify-center text-xs">✕</span>
                  <span class="text-rose-700">不正解</span>

              <!-- Explanation Text -->
              <div class="text-xs sm:text-sm leading-relaxed text-slate-800 bg-white/80 p-3.5 rounded-lg border border-slate-200/80 whitespace-pre-wrap mt-2">

      submitNormalAnswer(optNum) {
        const q = this.sessionQuestions[this.currentIndex];
        if (this.userAnswers[q.id]) return;

        const isCorrect = optNum === q.correct_answer;
        this.userAnswers[q.id] = { selected: optNum, isCorrect };

        if (!this.history.normal) this.history.normal = {};
        this.history.normal[q.id] = { selected: optNum, isCorrect, timestamp: Date.now() };
        this.saveHistory();

        if (isCorrect) {
          this.sound.playCorrect();
        } else {
          this.sound.playWrong();
        }

        this.renderQuizQuestion();
      }

      submitSpeedAnswer(userBool) {
        const q = this.sessionQuestions[this.currentIndex];
        if (this.userAnswers[q.id]) return;

        const isCorrect = userBool === q.answer;
        this.userAnswers[q.id] = { selected: userBool, isCorrect };

        if (!this.history.speed) this.history.speed = {};
        this.history.speed[q.id] = { selected: userBool, isCorrect, timestamp: Date.now() };
        this.saveHistory();

        if (isCorrect) {
          this.sound.playCorrect();
        } else {
          this.sound.playWrong();
        }

        this.renderQuizQuestion();
      }

      nextQuestion() {
        if (this.currentIndex < this.sessionQuestions.length - 1) {
          this.currentIndex++;
          this.renderQuizQuestion();
        }
      }

      prevQuestion() {
        if (this.currentIndex > 0) {
          this.currentIndex--;
          this.renderQuizQuestion();
        }
      }

        const total = this.sessionQuestions.length;
        let correctCount = 0;
        const wrongList = [];

        this.sessionQuestions.forEach(q => {

          if (ans && ans.isCorrect) {
            correctCount++;
          } else {
            wrongList.push(q);
          }

          rankColor = 'text-emerald-600';

          rankTitle = '合格圏内！よく理解できています！';
          rankColor = 'text-blue-600';
        } else if (percent >= 60) {
          rankTitle = 'あと一歩！間違えた問題を確認しましょう。';
          rankColor = 'text-amber-600';
        } else {
          rankTitle = '基本事項の復習を行いましょう！';
          rankColor = 'text-rose-600';

                <span class="text-xl font-bold text-slate-400">%</span>

              <!-- Action Buttons -->
              <div class="flex flex-wrap items-center justify-center gap-3 pt-4 border-t border-slate-100">
                ${wrongList.length > 0 ? `
                  <button onclick="app.retryWrong()" class="py-2.5 px-5 rounded-xl font-bold text-xs sm:text-sm bg-rose-500 hover:bg-rose-600 text-white shadow-sm flex items-center gap-2 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                    <span>間違えた問題だけ解く (${wrongList.length}問)</span>
                  </button>
                ` : ''}

                <button onclick="app.restartCurrentQuiz()" class="py-2.5 px-5 rounded-xl font-bold text-xs sm:text-sm bg-indigo-50 text-indigo-700 hover:bg-indigo-100 border border-indigo-200 flex items-center gap-2 transition">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                  <span>もう一度最初から解く</span>
                </button>

                <button onclick="app.goHome()" class="py-2.5 px-5 rounded-xl font-bold text-xs sm:text-sm bg-slate-800 hover:bg-slate-900 text-white shadow-sm flex items-center gap-2 transition">
                  <span>分野一覧に戻る</span>
                </button>
              </div>
            </div>

            <!-- Review Question List -->
            <div class="bg-white rounded-2xl p-5 sm:p-6 border border-slate-200 shadow-sm">
              <h3 class="text-sm font-bold text-slate-800 heading-font mb-3 flex items-center justify-between">
                <span>解答一覧と解説の確認</span>
                <span class="text-xs text-slate-400 font-normal">タップで問題に戻れます</span>
              </h3>

              <div class="divide-y divide-slate-100">
        `;

        this.sessionQuestions.forEach((q, idx) => {
          const ans = this.userAnswers[q.id];
          const isCorrect = ans && ans.isCorrect;

          html += `
            <div class="py-3 flex items-start justify-between gap-3 text-xs sm:text-sm">
              <div class="flex items-start gap-2.5 flex-1 cursor-pointer" onclick="app.jumpToQuestion(${idx})">
                <span class="w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-black shrink-0 ${isCorrect ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'} mt-0.5">
                  ${isCorrect ? '✓' : '✕'}
                </span>
                <div>
                  <div class="font-bold text-slate-900 line-clamp-1">
                    第${idx + 1}問: ${q.isSpeed ? q.statement : (q.theme ? `【${q.theme}】` : '') + q.question_text}
                  </div>
                  <div class="text-xs text-slate-400 mt-0.5 line-clamp-1">
                    解説: ${q.explanation.split('\n')[0]}
                  </div>
                </div>
              </div>
              <button onclick="app.jumpToQuestion(${idx})" class="text-indigo-600 hover:text-indigo-800 text-xs font-semibold px-2 py-1 rounded hover:bg-indigo-50 shrink-0">
                確認
              </button>
            </div>
          `;
        });

        html += `
              </div>
            </div>
          </div>
        `;

        this.container.innerHTML = html;
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      retryWrong() {
        const wrongList = this.sessionQuestions.filter(q => {
          const ans = this.userAnswers[q.id];
          return !ans || !ans.isCorrect;
        });
        if (wrongList.length === 0) return;

        this.sessionQuestions = wrongList;
        this.currentIndex = 0;
        this.userAnswers = {};
        this.renderQuizQuestion();
      }

      restartCurrentQuiz() {
        this.currentIndex = 0;
        this.userAnswers = {};
        this.renderQuizQuestion();
      }

      jumpToQuestion(idx) {
        this.currentIndex = idx;
        this.renderQuizQuestion();
      }
    }

    let app;
    window.addEventListener('DOMContentLoaded', () => {
      app = new QuizApp();
    });
  </script>
</body>
</html
