  <!-- Quiz Data Injection -->
  <script>
    const QUIZ_DATA = [{"id": "cat1", "title": "経済の原理とその発展", "page_range": "p.58〜59", "questions": [{"id": "c1_q1", "number": 1, "theme": "機会費用", "source": "政経, 倫理・政経本試", "question_text": "企業の土地利用を事例にして、機会費用の考え方とその適用例をまとめた次のメモ中の空欄[ ア ]・[ イ ]に当てはまる語句として最も適当なものを、次の①〜④のうちから一つ選べ。", "material": {"type": "memo", "content": "◇機会費用の考え方：ある選択肢を選んだとき、もし他の選択肢を選んでいたなら得られたであろう利益のうち、最大のもの。\n◇事例の内容と条件：ある限られた土地を公園、駐車場、宅地のいずれかとして利用する。利用によって企業が得る利益は、駐車場が最も大きく、次いで公園、宅地の順である。なお、各利用形態の整備費用は考慮しない。\n◇機会費用の考え方の適用例：ある土地をすべて駐車場として利用した場合、[ ア ]の関係から他の用途に利用できないため、そのときの機会費用は、[ イ ]を選択したときの利益に等しい。"}, "options": ["ア トレードオフ　イ 公園", "ア トレードオフ　イ 宅地", "ア ポリシー・ミックス　イ 公園", "ア ポリシー・ミックス　イ 宅地"], "correct_answer": 1, "explanation": "正解：①\nア…何かを選べば他の何かをあきらめなければならないのは、トレードオフの関係である。ポリシー・ミックスは、景気対策や物価対策などのために、財政政策や金融政策など複数の政策を組み合わせて実施することである。\nイ…駐車場以外の選択肢（公園・宅地）のうち利益が最大なのは公園である。"}, {"id": "c1_q2", "number": 2, "theme": "機会費用", "source": "政経追試", "question_text": "経済学ではある選択に対してさまざまな費用がかかると考えられている。いま、1,500円の料金を支払ってカラオケで遊ぶことができる。同じ時間を使って、アルバイトで1,800円の給与を得ることや、家事を手伝うことで1,000円のお小遣いを得ることもできる。この三つの選択肢のうち一つしか選べない場合、機会費用を含めたカラオケで遊ぶ費用はいくらになるか。正しいものを、次の①〜④のうちから一つ選べ。", "options": ["1,500円", "2,500円", "3,300円", "4,300円"], "correct_answer": 3, "explanation": "正解：③\n機会費用とは、同じ時間（期間）内に、選択しなかったこと（機会）から得られたはずの便益のうち最大のもの（最大利益）と、選択したこと（機会）との便益（利益）の差のこと。この問題で、選択しなかった最大利益は、アルバイトで1,800円の給与を得ること（＋1,800円）で、カラオケで遊ぶことを選択した場合の費用（－1,500円）との差額、すなわち1,800円－(－1,500円)＝1,800円＋1,500円＝3,300円が機会費用である。"}, {"id": "c1_q3", "number": 3, "theme": "資本主義経済の成立と発展", "source": "政経本試", "question_text": "生徒Xは、資本主義経済の成立と発展の概要について考察するためにキーワードを整理し、次のノートにまとめた。ノート中の下線部ア〜エのうち誤っているものを、次の①〜④のうちから一つ選べ。", "material": {"type": "note", "content": "○産業革命\n18世紀後半にイギリスで産業革命が起こり、その後、他のヨーロッパ諸国やアメリカ、そして日本でも産業革命が起こった。産業革命によって、工場制手工業から工場制機械工業へと発展し、生産力が飛躍的に高まった。\n○私有制\n(ア)生産手段を私有できることで、資本蓄積への意欲が高められる。\n○市場経済\n(イ)市場での自由な取引を通じて企業は利潤を追求し、その利潤がさらなる設備投資の資金となって経済が成長する。\n○階級分化\n資本主義経済下では、生産手段を所有する者と所有しない者、つまり資本家と労働者への階級分化が生じる。これが資本主義経済において経済格差が発生する要因の一つとなる。(ウ)マルクスは資本主義経済を分析し、資本家と労働者との間の利害の対立構造を明らかにした。\n○景気循環（景気変動）\n資本主義経済の発展によって、生活が豊かになる一方で、景気循環による不況や恐慌の発生という問題が起こる。(エ)ケインズは資本主義経済下での不況の原因は供給能力の不足にあるとの理論を示した。"}, "options": ["下線部(ア)", "下線部(イ)", "下線部(ウ)", "下線部(エ)"], "correct_answer": 4, "explanation": "正解：④\n下線部(エ)が誤り。ケインズは、不況や失業といった資本主義の矛盾の原因を有効需要の不足にあるとし、政府が積極的に経済に介入して完全雇用を実現すべきであると主張した（修正資本主義）。\n下線部(ウ)は正しい。マルクスは資本主義経済を批判的に考察し、資本主義のもとで労働者は資本家に搾取されているとした。"}, {"id": "c1_q4", "number": 4, "theme": "資本主義と政府の機能", "source": "政経追試", "question_text": "政府の機能については、資本主義の歴史的変化に応じてさまざまな考え方がなされてきた。そのような政府の機能をめぐる考え方についての記述として誤っているものを、次の①〜④のうちから一つ選べ。", "options": ["「夜警国家」の名付け親であるラッサールは、自由放任主義の考え方に立つ「小さな政府」を、肯定的に評価した。", "市場メカニズムのはたらきに強い信頼をおくフリードマンは、ケインズ政策を批判し、政府は安定的な通貨供給を行うべきだとした。", "第二次世界大戦後の先進資本主義国では、政府は、完全雇用の実現や社会保障制度の拡充を行うべきだとする考え方が広まった。", "1980年代のイギリスやアメリカでは、政府は、経済過程への介入を少なくしていくべきだとする考え方が広まった。"], "correct_answer": 1, "explanation": "正解：①\n①誤り ドイツの政治学者ラッサールは、社会主義の立場から自由放任主義を批判し、小さな政府を批判を込めて「夜警国家」と表現した。\n②③④正しい。②フリードマンは貨幣供給量が経済全体の状況を決定づけるというマネタリズムを唱え、財政政策の有効性には否定的な立場をとった。③第二次世界大戦後、福祉国家の考え方が資本主義国の間に広がった。④1980年代、イギリスのサッチャー政権やアメリカのレーガン政権は、規制緩和や公営企業の民営化などを行った（新自由主義、サッチャリズム、レーガノミクス）。"}, {"id": "c1_q5", "number": 5, "theme": "資本主義経済の発展", "source": "政経, 倫理・政経追試", "question_text": "資本主義経済の発展についての4つの記述を古い順に並べたとき、3番目にくるものとして最も適当なものを、次の①〜④のうちから一つ選べ。", "options": ["ME（マイクロ・エレクトロニクス）技術が利用されて、工場や事務所における作業や事務処理の自動化が進展した。", "鉄鋼業をはじめとした重工業が発展し、企業の大規模化や株式会社化が進行した。", "綿工業や毛織物工業などの繊維産業を中心に、工場制機械工業が確立し普及した。", "自動車や家電製品などの耐久消費財を中心に、大量生産・大量消費の時代が到来した。"], "correct_answer": 4, "explanation": "正解：④\n適当 古い順に並べると③→②→④→①。\n③18世紀後半〜19世紀にかけて、イギリスを皮切りに産業革命が起こった。\n②19世紀後半以降、鉄鋼業などの重工業が発展、企業の大規模化が進んだ。\n④アメリカでは1920年代から、欧州では第二次大戦後に、大企業中心の大量生産様式が広がり、国民の幅広い階層に自動車や家電製品などの耐久消費財が普及する大衆消費社会が到来した。\n①1980年代以降、ME化の進展により「大量生産」の時代から「多品種少量生産」の時代となった。"}, {"id": "c1_q6", "number": 6, "theme": "修正資本主義", "source": "政経追試", "question_text": "修正資本主義的政策およびその批判をめぐる記述として誤っているものを、次の①〜④のうちから一つ選べ。", "options": ["イギリスでは、大きな政府による社会保障支出の増大と下方硬直的な賃金に批判が高まり、1970年代末に保守党のサッチャー政権が成立した。", "1970年代には、インフレーションと景気の停滞が並存するというスタグフレーションが、先進諸国において広くみられた。", "アメリカでは、1960年代末から1970年代にかけて裁量的な財政・金融政策への批判が高まり、マネタリストの主張がその後の政策に影響を与えた。", "アメリカのレーガン政権は、規制緩和を中心とした一連の経済の自由化政策を行い、これにより1980年代後半には連邦財政が黒字化した。"], "correct_answer": 4, "explanation": "正解：④\n④誤り レーガン政権の規制緩和・自由化政策では、貿易赤字とともに財政赤字が増大した。これは「双子の赤字」と呼ばれたが、財政赤字については、1979年のソ連のアフガニスタン侵攻以降、「新冷戦」と呼ばれるほど米ソ関係が悪化し、ソ連に対抗するための軍事支出を増大させたことも影響している。①②③は正しい。"}, {"id": "c1_q7", "number": 7, "theme": "小さな政府", "source": "政経本試", "question_text": "小さな政府をめざす政策についての記述として誤っているものを、次の①〜④のうちから一つ選べ。", "options": ["イギリスのサッチャー政権やアメリカのレーガン政権が、この政策を採用した。", "この政策を採用する各国は、個人や企業の自助努力を重視した。", "日本では、日本国有鉄道、日本電信電話公社、日本専売公社の独立行政法人化が行われた。", "日本では、特殊法人の統廃合が行われた。"], "correct_answer": 3, "explanation": "正解：③\n③誤り 日本国有鉄道、日本電信電話公社、日本専売公社は、いずれも民営化されJR、NTT、JTとなった。"}, {"id": "c1_q8", "number": 8, "theme": "社会主義の変容", "source": "政経追試", "question_text": "20世紀末に生じた社会主義諸国の市場経済化をめぐる記述として正しいものを、次の①〜④のうちから一つ選べ。", "options": ["中国では、改革・開放政策への転換以降、急速に貿易が拡大し、1990年代後半には大幅な貿易収支黒字を実現した。", "1990年代の東欧諸国は、コメコン（経済相互援助会議）のもとで地域的経済協力を進めながら市場経済化を推進した。", "1990年代後半に、北朝鮮は「ドイモイ（刷新）」政策をスローガンに掲げて、集権的管理体制の是正に乗り出した。", "ロシアでは、1990年代末、プーチン大統領が、共産党一党支配を維持したまま市場経済化を進めた。"], "correct_answer": 1, "explanation": "正解：①\n①正しい。\n②誤り コメコン（経済相互援助会議）は、冷戦終結により1991年6月に解散した。\n③誤り 「ドイモイ（刷新）」政策は、ベトナムが1986年から行った経済の開放政策で、急速に経済発展した。\n④誤り 1991年のソ連崩壊で、共産党一党支配も崩壊した。"}], "speed_checks": [{"id": "c1_s1", "page": "p.58", "number": 1, "statement": "イギリスの産業革命では、蒸気機関の導入などによって生産力が増大したが、子どもの長時間労働等が深刻な社会問題となった。", "answer": true, "explanation": "正しい。蒸気機関の導入などで生産力が飛躍的に高まったが、劣悪な労働環境や児童労働などの深刻な社会問題を生んだ。"}, {"id": "c1_s2", "page": "p.58", "number": 2, "statement": "ベルトコンベアの発明などによって傾斜生産方式が確立したことで、自動車が大衆の乗り物や輸送手段として普及した。", "answer": false, "explanation": "誤り。傾斜生産方式ではなく、フォーディズム（大量生産方式）。傾斜生産方式は日本の戦後復興期に石炭・鉄鋼・電力などの基幹産業に重点的に資金や資材を投入した方式。"}, {"id": "c1_s3", "page": "p.58", "number": 3, "statement": "デジタル技術の発達を基盤としたIT革命によって、日本では携帯電話などの情報端末を利用した音楽配信等の多様なサービスが普及した。", "answer": true, "explanation": "正しい。IT革命により携帯電話やインターネットを通じた多様な情報サービスが普及した。"}, {"id": "c1_s4", "page": "p.58", "number": 4, "statement": "シュンペーターは、企業が古いものを破壊し新しいものを生み出す創造的破壊や技術革新を繰り返すことによって、経済は発展すると述べた。", "answer": true, "explanation": "正しい。シュンペーターは「創造的破壊（イノベーション）」が経済発展の原動力であると説いた。"}, {"id": "c1_s5", "page": "p.58", "number": 5, "statement": "マルクスは、各人による利己的な利益の追求が、結果として、社会全体の利益につながると述べた。", "answer": false, "explanation": "誤り。利己的な利益追求が「見えざる手」に導かれて社会全体の利益をもたらすと説いたのはアダム・スミスである。マルクスは資本主義の矛盾と搾取を批判した。"}, {"id": "c1_s6", "page": "p.58", "number": 6, "statement": "アダム=スミスは、資本主義経済が発展すると、貧富の差が拡大したり、恐慌が発生したりすることは避けることができないと主張した。", "answer": false, "explanation": "誤り。資本主義が発展すると貧富の差の拡大や恐慌の発生が避けられないと主張したのはマルクスである。"}, {"id": "c1_s7", "page": "p.58", "number": 7, "statement": "ケインズは、政府が財政・金融政策によって有効需要を増加させれば、経済は不況から脱し完全雇用を達成することができると主張した。", "answer": true, "explanation": "正しい。ケインズは有効需要の原理を唱え、政府による積極的な有効需要の創出によって完全雇用の達成が可能であると説いた。"}, {"id": "c1_s8", "page": "p.58", "number": 8, "statement": "1929年からはじまったアメリカの大恐慌は、他の資本主義諸国が順々に受けいれてきた世界的な大不況の余波を受けて生じたものである。", "answer": false, "explanation": "誤り。大恐慌はアメリカのニューヨーク・ウォール街での株価暴落をきっかけとして始まり、世界中に波及した。"}, {"id": "c1_s9", "page": "p.58", "number": 9, "statement": "1929年からのアメリカの大恐慌の象徴的な現象の一つに、それまで投機ブームに乗って上昇を続けていたウォール街における株価の暴落がある。", "answer": true, "explanation": "正しい。1929年10月のウォール街での株価大暴落が大恐慌の発端となった。"}, {"id": "c1_s10", "page": "p.58", "number": 10, "statement": "大恐慌期のアメリカ経済の停滞を克服するために、公共投資の縮小によって自由競争を活性化させようとするニューディール政策が施行された。", "answer": false, "explanation": "誤り。ニューディール政策は公共投資の拡大などによって有効需要を創出し景気回復をはかろうとする政策である（公共投資の縮小ではない）。"}, {"id": "c1_s11", "page": "p.59", "number": 1, "statement": "アメリカのフリードマンらは、市場経済の役割を重視する立場から、政府が経済に大きな役割を果たすケインズ理論を批判し、政府の役割は物価安定のための通貨量の調整にとどめるべきであるというマネタリズムの考えを唱えた。", "answer": true, "explanation": "正しい。マネタリスト（フリードマンら）はケインズ的な裁量的政策を批判し、通貨供給量の安定的な調整（マネタリズム）を主張した。"}, {"id": "c1_s12", "page": "p.59", "number": 2, "statement": "石油危機後、マネタリズムの考え方が注目され、1970年代末から1980年代初めのイギリスやアメリカの経済政策に採用された。", "answer": true, "explanation": "正しい。1970年代のスタグフレーションを機にマネタリズムや新自由主義が台頭し、英サッチャー政権や米レーガン政権の政策に採用された。"}, {"id": "c1_s13", "page": "p.59", "number": 3, "statement": "日本における規制緩和の一つのねらいは、行政上の事務負担を軽減するとともに、民間活力を増進させることにある。", "answer": true, "explanation": "正しい。規制緩和の目的は、行政改革・事務負担の軽減とともに、市場参入を促して民間活力を高めることにある。"}, {"id": "c1_s14", "page": "p.59", "number": 4, "statement": "1990年代には、従来の市場万能主義と異なり経済的効率と国民の福祉の向上をバランスよく達成しようとする「第三の道」という考え方が主張された。", "answer": true, "explanation": "正しい。イギリスのトニー・ブレア労働党政権が掲げた「第三の道」は、新自由主義と従来の福祉国家路線の両方を止揚し調和を目指した。"}, {"id": "c1_s15", "page": "p.59", "number": 5, "statement": "計画経済のもとでは、土地・工場などの生産手段は、国や協同組合の所有とされている。", "answer": true, "explanation": "正しい。計画経済のもとでは、土地や工場などの生産手段は私有が認められず、国家（国有）または協同組合の所有（社会的所有）とされる。"}, {"id": "c1_s16", "page": "p.59", "number": 6, "statement": "計画経済の場合、中央政府は、生産量については計画に基づき統制を行うが、その配分に関しては計画・統制を行わない。", "answer": false, "explanation": "誤り。計画経済では生産量だけでなく、価格や分配・流通も含めて中央政府が包括的に計画・統制を行う。"}, {"id": "c1_s17", "page": "p.59", "number": 7, "statement": "1990年代のロシアでは、政府の対外債務不履行を懸念して、外国資本の引揚げが相次いだ。", "answer": true, "explanation": "正しい。ソ連崩壊後のロシアでは急激な市場経済化（ショック療法）に伴うハイパーインフレや1998年の金融危機（デフォルト宣言）で外資引き揚げが相次いだ。"}, {"id": "c1_s18", "page": "p.59", "number": 8, "statement": "中国の経済特区は、中国資本の企業立地が禁じられ、外国資本の企業のみが操業を許可される特別経済地域である。", "answer": false, "explanation": "誤り。中国の経済特区は外資導入拡大を主な目的としたが、中国国内の企業立地が禁じられているわけではない。"}, {"id": "c1_s19", "page": "p.59", "number": 9, "statement": "中国の経済特区は、外国資本の導入拡大を目指したもので、投資企業に税制面での優遇措置が設けられてきた。", "answer": true, "explanation": "正しい。沿海部の深圳・珠海・汕頭・アモイなどに経済特区が設けられ、所得税免除などの税制優遇で外資を誘致した。"}, {"id": "c1_s20", "page": "p.59", "number": 10, "statement": "市場経済を一部導入した中国やベトナムでは、政府による規制もあって国内で経済的な格差はほとんど生じなかった。", "answer": false, "explanation": "誤り。中国やベトナムでは市場経済導入に伴い、沿海部と内陸部、都市部と農村部との間で激しい所得・経済格差が生じることとなった。"}]}, {"id": "cat2", "title": "現代経済のしくみ", "subtitle": "経済主体と経済の循環 / 現代の企業", "page_range": "p.65〜67", "questions": [{"id": "c2_q1", "number": 1, "theme": "経済主体", "source": "政経本試", "question_text": "経済活動に関連して、代表的な経済主体には家計、企業、政府などがあげられる。これらに関して、次の説明A〜Cのうち、正しいものはどれか。当てはまる説明すべてを含むものを、次の①〜⑦のうちから一つ選べ。", "material": {"type": "statements", "content": "A 家計は、保有する株や土地などの価格が上がると消費を増やす傾向があり、これは資産効果といわれる。\nB 企業は、生産が一定の地域で集中的に行われることにより生産および流通に必要な経費を節約できることがあり、これは集積の利益といわれる。\nC 政府は、必要な資金が不足する場合に公債を発行して中央銀行に直接引き受けてもらうことがあり、これは公債の市中消化といわれる。"}, "options": ["A", "B", "C", "AとB", "AとC", "BとC", "AとBとC"], "correct_answer": 4, "explanation": "正解：④\nAは正しい。日本では1980年代後半〜90年代初頭にかけて、このような資産効果によりバブル経済となった。\nBも正しい。たとえば取引関係にある複数の企業が一定の地域（都市）に集中して立地すれば、互いに取引にかかる交通費やその他のさまざまな経費を大幅に節約できる。このため、企業の立地は大都市に集中する傾向がある。\nCは誤り。公債の市中消化とは、政府が発行する公債を中央銀行に直接引き受けてもらうことを禁止し、民間（市中）の銀行や個人に引き受けさせること。日本銀行による国債の直接引き受けは、財政法第5条により原則として禁止されている。"}, {"id": "c2_q2", "number": 2, "theme": "経済主体", "source": "政経, 倫理・政経本試", "question_text": "次の図は、三つの経済主体間における経済循環の基本構造を示したものである。図中の矢印は財やお金の流れを示している。図中のA〜Cに当てはまるものの組合せとして最も適当なものを、次の①〜⑥のうちから一つ選べ。", "material": {"type": "diagram_html", "content": "<div class=\"border p-4 rounded bg-slate-50 my-2 text-sm text-slate-800\">\n  <div class=\"font-bold text-center mb-2\">【三つの経済主体間における経済循環の基本構造】</div>\n  <div class=\"grid grid-cols-2 gap-4\">\n    <div class=\"border-2 border-slate-700 p-2 rounded text-center bg-white font-bold\">家計</div>\n    <div class=\"border-2 border-slate-700 p-2 rounded text-center bg-white font-bold\">企業</div>\n  </div>\n  <div class=\"my-2 border-t border-b py-2 text-xs text-slate-600 space-y-1\">\n    <div>・家計 → 企業： 労働力、<strong>[ B ]</strong>、土地</div>\n    <div>・企業 → 家計： 賃金、財・サービスの代金、配当・利子、地代</div>\n    <div>・家計 → 政府： 労働力、<strong>[ A ]</strong></div>\n    <div>・政府 → 家計： 賃金、社会保障給付、公共サービス</div>\n    <div>・企業 → 政府： 財・サービス、<strong>[ A ]</strong></div>\n    <div>・政府 → 企業： 財・サービスの代金、補助金、公共サービス</div>\n    <div>・政府・企業から供給されるもの： <strong>[ C ]</strong>（公共インフラ等）</div>\n  </div>\n  <div class=\"border-2 border-slate-700 p-2 rounded text-center bg-white font-bold w-1/2 mx-auto\">政府</div>\n</div>"}, "options": ["A 資本　B 租税・社会保険料　C 社会資本", "A 資本　B 社会資本　C 租税・社会保険料", "A 社会資本　B 資本　C 租税・社会保険料", "A 社会資本　B 租税・社会保険料　C 資本", "A 租税・社会保険料　B 資本　C 社会資本", "A 租税・社会保険料　B 社会資本　C 資本"], "correct_answer": 5, "explanation": "正解：⑤\nA＝租税・社会保険料：家計・企業が政府に提供するもの。\nB＝資本：家計は企業に対して、銀行預金などによって間接的に、株式や社債の購入によって直接的に資本を提供する。\nC＝社会資本：政府は家計や企業に対して、道路や港湾、上下水道や公園など産業や生活の基盤となる社会資本を提供する。"}, {"id": "c2_q3", "number": 3, "theme": "企業や家計", "source": "政経本試", "question_text": "企業や家計についての記述として最も適当なものを、次の①〜④のうちから一つ選べ。", "options": ["家計は、他の条件が一定である場合、その保有する資産の価格が上昇すると消費額を増やす傾向にある。", "企業は、他の条件が一定である場合、銀行の貸出金利が低下すると設備投資を減少させる傾向にある。", "日本の家計を全体でみると、消費支出のうち食料費よりも保健医療費の方が多い。", "日本の従業者を全体でみると、中小企業で働く人数よりも大企業で働く人数の方が多い。"], "correct_answer": 1, "explanation": "正解：①\n①適当 株価や地価の上昇によって消費が増えることを資産効果という。日本ではバブル景気の時にこの傾向が顕著に見られた。\n②不適当 銀行の貸出金利が低下すれば、企業は資金が借りやすくなるので設備投資を増やす傾向となる。\n③不適当 家計消費支出に占める食料費の割合を示すのがエンゲル係数である。日本の家計において、消費支出に占める保健医療費の割合よりも食料費の割合（エンゲル係数）の方が高い。\n④不適当 日本の従業者数の内訳は、おおむね中小企業が7割、大企業が3割である。"}, {"id": "c2_q4", "number": 4, "theme": "企業", "source": "政経本試", "question_text": "企業についての記述として正しいものを、次の①〜④のうちから一つ選べ。", "options": ["日本の会社法に基づいて設立できる企業に、有限会社がある。", "企業の経営者による株主の監視を、コーポレート・ガバナンスという。", "日本の中央銀行である日本銀行は、政府全額出資の企業である。", "企業による芸術や文化への支援活動を、メセナという。"], "correct_answer": 4, "explanation": "正解：④\n④正しい。メセナは、企業による芸術・文化分野への支援活動（資金提供や文化活動の主催など）のことで、企業のイメージアップや社員の質的向上、社会貢献などのために広く行われている。\n①誤り 有限会社は、会社法の施行（2006年5月）によって株式会社の一形態として扱われるようになり、新たに設立することはできなくなった。\n②誤り コーポレート・ガバナンス（企業統治）とは、企業の不正防止や事業活動の適正化によって株主などの利益を守るために、会社の外から企業活動の在り方をチェックすること。\n③誤り 日本銀行は財務省所管の認可法人（公私合同企業）で、資本金1億円のうち政府が55%、個人や金融機関が45%を出資している。"}, {"id": "c2_q5", "number": 5, "theme": "企業の利潤", "source": "政経本試", "question_text": "利潤についての記述として正しいものを、次の①〜④のうちから一つ選べ。", "options": ["企業内部に蓄えられた利潤は、設備投資のような企業規模の拡大のための原資として用いられることがある。", "国民経済計算では、企業の利潤は雇用者報酬に分類される。", "企業の利潤は、賃金や原材料費などの費用に、生産活動により得られた収入を付け加えたものである。", "株式会社の場合、利潤から株主に支払われる分配金は出資金と呼ばれる。"], "correct_answer": 1, "explanation": "正解：①\n①正しい。企業内部に蓄えられた利潤は内部留保と呼ばれ、一般に企業の純利益から、税金、配当金、役員賞与などの社外流出分を差し引いた残りのことをさし、設備投資や研究開発などに用いられる。\n②誤り 企業の利潤は、分配国民所得の中の企業所得に分類される。\n③誤り 企業の利潤＝生産活動で得られた収入－賃金や原材料費などの費用である。\n④誤り 株式会社の利潤から株主に支払われる分配金は、配当金である。"}, {"id": "c2_q6", "number": 6, "theme": "株式会社", "source": "政経, 倫理・政経本試", "question_text": "日本における株式会社についての記述として正しいものを、次の①〜④のうちから一つ選べ。", "options": ["独占禁止法の下では、事業活動を支配することを目的として、他の株式会社の株式を保有することが禁止されている。", "会社法の下では、株式会社の設立にあたって、最低資本金の額が定められている。", "株式会社のコーポレート・ガバナンスに関しては、バブル経済の崩壊以降、株主の権限の制約が主張されている。", "株式会社の活動によって生じた利潤は、株主への配当以外に、投資のための資金としても利用されている。"], "correct_answer": 4, "explanation": "正解：④\n④正しい。利潤の一部は「内部留保」として企業に残され、投資のための資金などに利用される。\n①誤り 純粋持株会社は、戦前の財閥復活防止のため独占禁止法で禁止されていたが、日本企業の国際競争力強化などの目的で1997年独禁法改正により解禁された。\n②誤り 株式会社設立時の最低資本金制度（資本金1,000万円以上）は、2006年に施行された会社法で撤廃された（資本金1円から設立可能）。\n③誤り バブル崩壊後、経営の透明化や不正防止のために株主による経営監視の強化（コーポレート・ガバナンス）が主張されるようになった。"}, {"id": "c2_q7", "number": 7, "theme": "株式会社", "source": "政経追試", "question_text": "日本の株式会社に関する記述として誤っているものを、次の①〜④のうちから一つ選べ。", "options": ["株式会社の設立に必要な資本金は百万円以上と定められている。", "株式会社は社債の発行により資金を調達できる。", "株式会社は農業経営に参入できる。", "株式会社の経営と所有は分離可能である。"], "correct_answer": 1, "explanation": "正解：①\n①誤り 2006年施行の会社法により資本金1円から株式会社設立が可能となった。\n②③④正しい。④は株式会社の重要な特徴の一つである（所有と経営の分離）。"}, {"id": "c2_q8", "number": 8, "theme": "コンプライアンス（法令遵守）", "source": "政経, 倫理・政経追試", "question_text": "企業によるコンプライアンス（法令遵守）の例として最も適当なものを、次の①〜④のうちから一つ選べ。", "options": ["食品の産地について実際とは異なる表示を行った。", "消費者からのクーリング・オフの求めに応じた。", "残業代を支払わないで従業員に時間外労働をさせた。", "赤字を実際よりも過小に表示するような決算を行った。"], "correct_answer": 2, "explanation": "正解：②\n②適当。\n①産地偽装、④粉飾決算は各種の法令に違反する行為である。\n③時間外労働に対する割増賃金を支払わないことは、労働基準法第37条に違反する行為であり、不適当。"}, {"id": "c2_q9", "number": 9, "theme": "企業活動", "source": "政経追試", "question_text": "次の図はある製品の企画・発案後のサプライチェーンを示し、AとBは製造、販売とともにサプライチェーンを構成する過程を示す。図の右矢印は製品が作られ、販売されるまでの流れを意味する。また、次のア〜ウは自然災害によって、サプライチェーンが寸断された事例を示したものである。図中のA、Bの過程とそれぞれに該当する事例ア〜ウとの組合せとして最も適当なものを、次の①〜⑥のうちから一つ選べ。", "material": {"type": "flow_and_cases", "content": "<div class=\"my-3 p-3 bg-slate-50 border rounded text-center\">\n  <div class=\"inline-flex items-center gap-2 font-bold text-slate-800\">\n    <span class=\"px-3 py-1 bg-blue-100 border border-blue-400 rounded\">A</span>\n    <span>⇒</span>\n    <span class=\"px-3 py-1 bg-white border border-slate-400 rounded\">製造</span>\n    <span>⇒</span>\n    <span class=\"px-3 py-1 bg-blue-100 border border-blue-400 rounded\">B</span>\n    <span>⇒</span>\n    <span class=\"px-3 py-1 bg-white border border-slate-400 rounded\">販売</span>\n  </div>\n</div>\n<div class=\"space-y-1 text-sm bg-amber-50 p-3 rounded border border-amber-200 text-slate-800\">\n  <div><strong>ア</strong> 大雪により、高速道路が閉鎖され、製品を小売店に配送することができなくなった。</div>\n  <div><strong>イ</strong> 洪水により、自社工場の機械設備が浸水し、一時的に操業を停止することになった。</div>\n  <div><strong>ウ</strong> 地震により、取引先企業が被災し、原材料を仕入れることができなくなった。</div>\n</div>"}, "options": ["A-ア　B-イ", "A-ア　B-ウ", "A-イ　B-ア", "A-イ　B-ウ", "A-ウ　B-ア", "A-ウ　B-イ"], "correct_answer": 5, "explanation": "正解：⑤\nAは、製造の前段階なので、ウの「原材料の仕入れ」が該当する。Bは、製造と販売の間なので「流通・配送」段階であり、アの「小売店に配送」が該当する。（イは製造過程の寸断事例）"}, {"id": "c2_q10", "number": 10, "theme": "企業", "source": "政経, 倫理・政経本試", "question_text": "日本における企業に関する記述として最も適当なものを、次の①〜④のうちから一つ選べ。", "options": ["自社の株価の低下を招くような社内の行為をその会社の株主が監視することを、リストラクチャリングという。", "ある企業の1年間の利潤のうち、株主への分配率が上昇すると内部留保への配分率も上昇し、企業は設備投資を増やすようになる。", "世界的に拡大した感染症による経済的影響として、いわゆる巣ごもり需要の増加に対応することで2020年に売上を伸ばした企業があった。", "1990年代のバブル経済崩壊後、会社法が制定され、株式会社設立のための最低資本金額が引き上げられた。"], "correct_answer": 3, "explanation": "正解：③\n③適当。\n①不適当 リストラクチャリングではなくコーポレート・ガバナンス。\n②不適当 利潤のうち株主への分配率が上昇すると、内部留保への配分率は低下する。\n④不適当 会社法（2006年施行）で最低資本金制度は撤廃され、資本金1円で設立可能となった。"}, {"id": "c2_q11", "number": 11, "theme": "企業の資金調達", "source": "政経, 倫理・政経本試", "question_text": "次の表は日本とアメリカにおいて、企業がどのようにして資金調達を行ったのかを示したものである。この表から読みとれる内容として最も適当なものを、次の①〜④のうちから一つ選べ。", "material": {"type": "table_html", "content": "<div class=\"overflow-x-auto my-2\">\n<table class=\"min-w-full text-xs text-center border-collapse border border-slate-400 bg-white\">\n  <thead>\n    <tr class=\"bg-slate-100\">\n      <th class=\"border border-slate-300 px-2 py-1\" colspan=\"2\">(単位: %)</th>\n      <th class=\"border border-slate-300 px-2 py-1\">銀行等借入</th>\n      <th class=\"border border-slate-300 px-2 py-1\">債券</th>\n      <th class=\"border border-slate-300 px-2 py-1\">株式・出資金</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td class=\"border border-slate-300 px-2 py-1 font-semibold\" rowspan=\"2\">日本</td>\n      <td class=\"border border-slate-300 px-2 py-1\">1999年12月末</td>\n      <td class=\"border border-slate-300 px-2 py-1\">38.8</td>\n      <td class=\"border border-slate-300 px-2 py-1\">9.3</td>\n      <td class=\"border border-slate-300 px-2 py-1\">33.8</td>\n    </tr>\n    <tr>\n      <td class=\"border border-slate-300 px-2 py-1\">2017年3月末</td>\n      <td class=\"border border-slate-300 px-2 py-1\">24.2</td>\n      <td class=\"border border-slate-300 px-2 py-1\">4.1</td>\n      <td class=\"border border-slate-300 px-2 py-1\">49.9</td>\n    </tr>\n    <tr class=\"bg-slate-50\">\n      <td class=\"border border-slate-300 px-2 py-1 font-semibold\" rowspan=\"2\">アメリカ</td>\n      <td class=\"border border-slate-300 px-2 py-1\">1999年12月末</td>\n      <td class=\"border border-slate-300 px-2 py-1\">12.1</td>\n      <td class=\"border border-slate-300 px-2 py-1\">8.2</td>\n      <td class=\"border border-slate-300 px-2 py-1\">66.6</td>\n    </tr>\n    <tr class=\"bg-slate-50\">\n      <td class=\"border border-slate-300 px-2 py-1\">2017年3月末</td>\n      <td class=\"border border-slate-300 px-2 py-1\">6.2</td>\n      <td class=\"border border-slate-300 px-2 py-1\">13.7</td>\n      <td class=\"border border-slate-300 px-2 py-1\">56.5</td>\n    </tr>\n  </tbody>\n</table>\n<div class=\"text-[10px] text-slate-500 mt-1 text-left\">\n(注) ここでの企業とは民間非金融法人企業のことである。なお、「その他」の数値を省略していることから、どの年も合計が100パーセントにならない。<br>\n(資料) 日本銀行調査統計局「欧米主要国の資金循環統計」および同「資金循環の日米欧比較」「両資料とも日本銀行Webページ」により作成。\n</div>\n</div>"}, "options": ["日本の企業における資金調達のあり方を1999年12月末時点と2017年3月末時点とで比較した場合、2017年の方が他人資本の割合が高い。", "アメリカの企業における資金調達のあり方を1999年12月末時点と2017年3月末時点とで比較した場合、2017年の方が間接金融の割合が低い。", "2017年3月末時点の資金調達において、日本の企業はアメリカの企業よりも直接金融の割合が高い。", "1999年12月末時点の資金調達において、アメリカの企業は日本の企業よりも自己資本の割合が低い。"], "correct_answer": 2, "explanation": "正解：②\n②適当 銀行等借入は間接金融に該当する。アメリカでは1999年12.1%から2017年6.2%へ低下しており、間接金融の割合が低くなっている。\n①誤り 日本の他人資本（銀行等借入＋債券）は1999年48.1%、2017年28.3%であり、2017年の方が低い。\n③誤り 直接金融（債券＋株式・出資金）の割合は、2017年において日本は54.0%、アメリカは70.2%であり、アメリカの方が高い。\n④誤り 自己資本（株式・出資金）は1999年においてアメリカ66.6%、日本33.8%であり、アメリカの方が高い。"}, {"id": "c2_q12", "number": 12, "theme": "リストラクチャリング", "source": "政経追試", "question_text": "市場の変化によって自社のリストラクチャリング（再構築）が必要になる場合がある。ある基幹事業を中心にいくつかの事業を行っているA社が、自社のもつ事業分野を増やすためのリストラクチャリングを行ったことを示す事例として最も適当なものを、次の①〜④のうちから一つ選べ。", "options": ["市場の変化によって不振となったA社のある事業をB社として完全に分社化し、その事業をB社の基幹事業として経営させることとした。", "A社は、事業の業績の向上によって資産が増えたため、その管理や運用のみをC社に委託した。", "自社製品の品質向上のため、関連技術をもつD社を買収し、A社の当該製品の事業のみに注力させることとした。", "A社は、自社の基幹事業を行いつつ、成長が期待される事業を創設するため、関連技術をもつE社の株式を完全に取得して吸収合併した。"], "correct_answer": 4, "explanation": "正解：④\n④適当。リストラクチャリング（事業再構築）とは、経営環境の変化に適応して事業構造を再構築していくことである。問題文にある「自社のもつ事業分野を増やすためのリストラクチャリング」に該当するのは、関連技術をもつ企業を吸収合併して新たな成長事業を創設する④である。\n①は事業の切り離し（分社化）、②は資産管理運用の委託、③は特定事業への注力（特化）である。"}], "speed_checks": [{"id": "c2_s1", "page": "p.65", "number": 1, "statement": "経済活動を行う単位として、家計・企業・政府の三つがあり、これらを経済主体と呼ぶ。", "answer": true, "explanation": "正しい。経済活動を行う3つの基本単位を経済主体（家計・企業・政府）と呼ぶ。"}, {"id": "c2_s2", "page": "p.65", "number": 2, "statement": "家計は消費主体であり、労働所得や事業所得を得て、政府に税金を払い、残りの所得（可処分所得）を消費と貯蓄にまわす。", "answer": true, "explanation": "正しい。家計は可処分所得（所得から税や社会保険料を差し引いた額）を消費と貯蓄に配分する。"}, {"id": "c2_s3", "page": "p.65", "number": 3, "statement": "家計の消費支出は、日本の国民経済全体の約8割を占め、その動向は企業活動にも大きな影響を与えている。", "answer": false, "explanation": "誤り。日本の国内総支出（GDE/GDP）において、家計の最終消費支出が占める割合は約5〜6割（約6割）である。"}, {"id": "c2_s4", "page": "p.65", "number": 4, "statement": "所有と経営の分離によって、経営に対する株主の支配は強化された。", "answer": false, "explanation": "誤り。所有と経営の分離が進むと、専門的経営者に経営の実権が移り、一般株主による直接的支配は希薄化（弱体化）する傾向がある。"}, {"id": "c2_s5", "page": "p.65", "number": 5, "statement": "日本の上場会社について、1990年代後半には、個人が所有する株式数よりも、金融機関を含む法人が所有する株式数の方が少なかった。", "answer": false, "explanation": "誤り。1990年代後半の日本の上場企業では、株式持ち合いなどにより法人（金融機関や事業法人）が所有する株式数の方が個人所有より多かった。"}, {"id": "c2_s6", "page": "p.65", "number": 6, "statement": "ある企業の株式を購入した者は、その企業が倒産したとき、その債務について、自らが出資した金額を超えて返済の義務を負う。", "answer": false, "explanation": "誤り。株式会社の株主は有限責任であり、出資した金額を限度として責任を負い、出資額を超えて返済する義務はない。"}, {"id": "c2_s7", "page": "p.65", "number": 7, "statement": "社債を発行して資金調達した企業は、株式の発行による場合とは異なり、期限が到来すれば社債の償還をしなければならない。", "answer": true, "explanation": "正しい。社債は他人資本（借入金）であり満期に元本を償還しなければならないが、株式は自己資本であり返済義務はない。"}, {"id": "c2_s8", "page": "p.65", "number": 8, "statement": "ある企業の社債を購入した者は、その企業の経営状態にかかわりなく、発行時に決めた配当を受け取ることができる。", "answer": false, "explanation": "誤り。社債で受け取るのは「利息（利子）」であり、「配当」ではない（配当は株式に対して支払われる）。"}, {"id": "c2_s9", "page": "p.65", "number": 9, "statement": "株主総会では、株主の株式保有数に応じて議決権を行使でき、過半数の議決をもって議案が採択されるので、議決が大株主の意向に左右される。", "answer": true, "explanation": "正しい。株式会社では「1株1議決権」が原則であり、持株数に応じた議決権を行使するため大株主の影響力が大きくなる。"}, {"id": "c2_s10", "page": "p.65", "number": 10, "statement": "株主総会では、取締役の選出や解任を行うことができる。", "answer": true, "explanation": "正しい。株主総会は株式会社の最高意思決定機関であり、取締役などの役員の選任・解任を行う権限を持つ。"}, {"id": "c2_s11", "page": "p.66", "number": 1, "statement": "2006年に施行された会社法により合同会社が新設された。", "answer": true, "explanation": "正しい。2006年施行の会社法により、出資者全員が有限責任で迅速な意思決定ができる「合同会社（LLC）」が新設された。"}, {"id": "c2_s12", "page": "p.66", "number": 2, "statement": "株式会社は、経営に参加する無限責任社員で構成されており、有限責任社員はいない。", "answer": false, "explanation": "誤り。株式会社の出資者（社員）は全員が有限責任社員である。"}, {"id": "c2_s13", "page": "p.66", "number": 3, "statement": "企業が環境対策に費やした経費や企業活動が環境に及ぼした影響などを認識・測定し、公表する試みが行われている。", "answer": true, "explanation": "正しい。環境会計（環境保全コストと効果の測定・公表）などの取り組みが行われている。"}, {"id": "c2_s14", "page": "p.66", "number": 4, "statement": "企業が行うメセナとは、ボランティア活動支援を通じて地域社会に貢献することを目的としたものである。", "answer": false, "explanation": "誤り。メセナは主に「芸術・文化活動への支援」を指す。ボランティア支援や地域貢献全般はフィランソロピーやCSRに含まれる。"}, {"id": "c2_s15", "page": "p.66", "number": 5, "statement": "企業が事業の再構築を行うことをリストラクチャリングというが、日本ではリストラという語で人員整理のことを意味する場合が多い。", "answer": true, "explanation": "正しい。リストラクチャリングは本来「事業再構築」全般を指すが、日本では人員削減の意味で使われることが多い。"}, {"id": "c2_s16", "page": "p.66", "number": 6, "statement": "企業が行うフィランソロピーとは、慈善活動・社会貢献活動のことであり、福祉、地域興し、災害救援などの活動を支援することが含まれる。", "answer": true, "explanation": "正しい。フィランソロピーは企業の慈善活動や社会的貢献活動を指す。"}, {"id": "c2_s17", "page": "p.66", "number": 7, "statement": "企業が公表している環境報告書や持続可能性（サステナビリティ）報告書は、企業の社会的責任（CSR）を意識したものとはいえない。", "answer": false, "explanation": "誤り。環境報告書やサステナビリティ報告書は、まさに企業の社会的責任（CSR）を果たし説明責任を果たすためのものである。"}, {"id": "c2_s18", "page": "p.66", "number": 8, "statement": "企業の社会的責任として、ISO（国際標準化機構）の定める環境保全対策国際統一規格である14000シリーズの認証を取得する企業が増えている。", "answer": true, "explanation": "正しい。ISO14000シリーズは環境マネジメントシステムの国際規格である。"}, {"id": "c2_s19", "page": "p.66", "number": 9, "statement": "環境保護といった社会的に重要な問題にうち積極的に取り組む企業を選別し、そうした企業の株式へ選択的に投資することが行われている。", "answer": true, "explanation": "正しい。社会的責任投資（SRI）やESG投資のことである。"}, {"id": "c2_s20", "page": "p.66", "number": 10, "statement": "企業の意思決定や経営をチェックするためのしくみをディスクロージャーという。", "answer": false, "explanation": "誤り。経営を監視・統治する仕組みはコーポレート・ガバナンス（企業統治）。ディスクロージャーは企業内容の開示・情報公開のことである。"}, {"id": "c2_s21", "page": "p.66", "number": 11, "statement": "2006年に制定（2006年施行）された会社法により、有限会社を新たに設立できなくなった。", "answer": true, "explanation": "正しい。会社法施行により有限会社制度は廃止され、新規設立はできなくなった（既存の有限会社は特例有限会社として存続）。"}, {"id": "c2_s22", "page": "p.67", "number": 1, "statement": "戦後の企業集団においては、様々な産業分野の企業が、社長同士の定期的な会合やその他の人的交流などを通じて横のつながりを強化していた。", "answer": true, "explanation": "正しい。戦後の企業集団（三井・三菱・住友・富士・三和・第一勧銀など）では「社長会」などで情報交換や横の連携を保った。"}, {"id": "c2_s23", "page": "p.67", "number": 2, "statement": "戦後の企業集団においては、戦前の財閥の流れをくむ持株会社が、集団内の企業の株を多数所有して、企業集団の頂点に立っていた。", "answer": false, "explanation": "誤り。戦後は独禁法により持株会社が禁止されていたため、頂点に立つ持株会社はなく、相互の株式持ち合いによる緩やかな集団であった。"}, {"id": "c2_s24", "page": "p.67", "number": 3, "statement": "M&Aとは、同業種の企業を合併・買収し、シェア（市場占有率）の拡大を図ることを指し、異業種の企業間による合併・買収を意味しない。", "answer": false, "explanation": "誤り。M&Aには同業種の水平的統合だけでなく、川上・川下への垂直的統合や異業種への多角化（コングロマリット化）も含まれる。"}, {"id": "c2_s25", "page": "p.67", "number": 4, "statement": "M&Aには、経営効率化や新技術獲得による競争力強化を目的とした合併・買収のほか、経営不振企業の救済を目的としたものも含まれる。", "answer": true, "explanation": "正しい。M&Aの目的は多岐にわたり、新規市場参入や技術獲得のほか、破綻寸前の企業の救済目的も行われる。"}, {"id": "c2_s26", "page": "p.67", "number": 5, "statement": "日本では、M&Aを促進する見地から、M&A後の企業のシェアの大きさに関しては、独占禁止法の規定は適用されない。", "answer": false, "explanation": "誤り。M&Aによって実質的に競争を制限することとなる場合は、公正取引委員会により独占禁止法に基づき制限・禁止される。"}, {"id": "c2_s27", "page": "p.67", "number": 6, "statement": "近年、政府が起業の促進をはかっていることもあり、日本の開業率は米英仏独などの主要国並みとなっている。", "answer": false, "explanation": "誤り。日本の開業率は約4〜5%程度で推移しており、米英（10%超）など主要先進国と比較して依然として低水準である。"}, {"id": "c2_s28", "page": "p.67", "number": 7, "statement": "多国籍企業は、第二次世界大戦後にヨーロッパの巨大企業がアメリカに生産・販売拠点を置いて海外展開したことをその端緒とする。", "answer": false, "explanation": "誤り。第二次世界大戦後にアメリカの巨大企業がヨーロッパや中南米等に進出したのが多国籍企業の発展の端緒である。"}, {"id": "c2_s29", "page": "p.67", "number": 8, "statement": "多国籍企業は、巨額の海外金融資産を保有しているが、それを投機的に運用して為替相場の動揺を鎮める。", "answer": false, "explanation": "誤り。巨額の資金が為替市場で投機的に移動することにより、為替相場の急変動や混乱（動揺）を助長することがある。"}, {"id": "c2_s30", "page": "p.67", "number": 9, "statement": "多国籍企業のなかには、その年間売上高が先進工業国の年間のGDP（国内総生産）を上回る巨大なものもある。", "answer": true, "explanation": "正しい。巨大多国籍企業の中には売上高が中規模国家の国家予算やGDPに匹敵・上回る規模のものも存在する。"}, {"id": "c2_s31", "page": "p.67", "number": 10, "statement": "多国籍企業では、海外の現地子会社が親会社の管理下で事業を進めているので、子会社は現地国の法律の適用を免れる。", "answer": false, "explanation": "誤り。海外の現地子会社であっても、その所在する現地国の主権および法律の適用を当然に受ける。"}]}, {"id": "cat3", "title": "市場経済の機能と限界 / 市場の失敗", "page_range": "p.68〜70", "questions": [{"id": "c3_q1", "number": 1, "theme": "市場", "source": "政経, 倫理・政経本試", "question_text": "市場の機能や限界についての説明として正しいものを、次の①〜④のうちから一つ選べ。", "options": ["寡占市場では、市場による価格調整がうまく働くので、消費者が買いたいものが安価な価格になる。", "生産技術の開発や生産の合理化によって生産費用が低下しても、価格が下方に変化しにくくなることを、逆資産効果という。", "鉄道のように、初期投資に巨額の費用がかかる大型設備を用いる産業では、少数の企業による市場の支配が生じにくい。", "寡占市場で価格先導者が一定の利潤を確保できるような価格を設定し、他の企業もそれに追随するような価格を、管理価格という。"], "correct_answer": 4, "explanation": "正解：④\n④正しい。寡占市場において、価格先導者（プライス・リーダー）となる有力企業が中心となって設定し他社が追随する価格を「管理価格」という。\n①誤り 寡占市場では価格競争が起きにくく、価格が高止まり（割高）しやすいため、消費者に安価になるとは限らない。\n②誤り 生産コストが低下しても価格が下がりにくくなる現象は「価格の下方硬直性」という。「逆資産効果」は株や土地の価格下落により消費が抑制されること。\n③誤り 鉄道や電力のように初期投資に巨額の固定設備が必要な産業（自然独占が生じる産業）では、新規参入が難しく少数の企業による市場支配（寡占や独占）が生じやすい。"}, {"id": "c3_q2", "number": 2, "theme": "市場原理", "source": "政経, 倫理・政経第2回", "question_text": "次の文章中の空欄[ ア ]・[ イ ]に当てはまる語句と数値の組合せとして最も適当なものを、次の①〜⑥のうちから一つ選べ。\n\n次の図において、あるスニーカーの供給曲線がS、需要曲線がDで表されている。スニーカーの人気が高まった場合、需要曲線はDから[ ア ]へとシフトし、均衡点が移動する。\n次に、供給曲線はシフトしないという条件の下で、より具体的な数字を当てはめて需要曲線のDから[ ア ]へのシフトを考える。当初の均衡価格(P0)が1足当たり1万円、均衡での数量(Q0)が8,000足の状態から、価格が30パーセント、数量は20パーセント変化した場合、売上総額の変化量は[ イ ]である。", "material": {"type": "diagram_html", "content": "<div class=\"my-3 p-3 bg-slate-50 border rounded text-center\">\n  <div class=\"text-xs text-slate-500 mb-2\">【スニーカー市場の需要曲線・供給曲線モデル】</div>\n  <svg viewBox=\"0 0 300 200\" class=\"w-full max-w-xs mx-auto border bg-white\">\n    <!-- Axes -->\n    <line x1=\"40\" y1=\"180\" x2=\"280\" y2=\"180\" stroke=\"#334155\" stroke-width=\"2\"/>\n    <line x1=\"40\" y1=\"180\" x2=\"40\" y2=\"20\" stroke=\"#334155\" stroke-width=\"2\"/>\n    <text x=\"30\" y=\"25\" font-size=\"11\" fill=\"#334155\" font-weight=\"bold\">価格</text>\n    <text x=\"260\" y=\"195\" font-size=\"11\" fill=\"#334155\" font-weight=\"bold\">数量</text>\n    <text x=\"25\" y=\"185\" font-size=\"11\" fill=\"#334155\">0</text>\n    <!-- Supply S -->\n    <line x1=\"60\" y1=\"160\" x2=\"240\" y2=\"40\" stroke=\"#2563eb\" stroke-width=\"2\"/>\n    <text x=\"245\" y=\"45\" font-size=\"12\" fill=\"#2563eb\" font-weight=\"bold\">S</text>\n    <!-- Demand D -->\n    <line x1=\"60\" y1=\"40\" x2=\"240\" y2=\"160\" stroke=\"#dc2626\" stroke-width=\"2\"/>\n    <text x=\"245\" y=\"165\" font-size=\"12\" fill=\"#dc2626\" font-weight=\"bold\">D</text>\n    <!-- Demand D' (right shift) -->\n    <line x1=\"100\" y1=\"40\" x2=\"280\" y2=\"160\" stroke=\"#ea580c\" stroke-width=\"2\" stroke-dasharray=\"4\"/>\n    <text x=\"275\" y=\"150\" font-size=\"12\" fill=\"#ea580c\" font-weight=\"bold\">D'</text>\n    <!-- Demand D'' (left shift) -->\n    <line x1=\"40\" y1=\"60\" x2=\"200\" y2=\"170\" stroke=\"#64748b\" stroke-width=\"1.5\" stroke-dasharray=\"3\"/>\n    <text x=\"205\" y=\"175\" font-size=\"11\" fill=\"#64748b\">D''</text>\n    <!-- Initial Equilibrium (P0, Q0) -->\n    <circle cx=\"150\" cy=\"100\" r=\"3\" fill=\"#1e293b\"/>\n    <line x1=\"40\" y1=\"100\" x2=\"150\" y2=\"100\" stroke=\"#94a3b8\" stroke-dasharray=\"2\"/>\n    <line x1=\"150\" y1=\"100\" x2=\"150\" y2=\"180\" stroke=\"#94a3b8\" stroke-dasharray=\"2\"/>\n    <text x=\"15\" y=\"104\" font-size=\"10\" fill=\"#334155\">P₀</text>\n    <text x=\"143\" y=\"195\" font-size=\"10\" fill=\"#334155\">Q₀</text>\n  </svg>\n</div>"}, "options": ["ア D'　イ 4,480万円", "ア D'　イ 3,620万円", "ア D'　イ 2,840万円", "ア D''　イ 4,480万円", "ア D''　イ 3,620万円", "ア D''　イ 2,840万円"], "correct_answer": 1, "explanation": "正解：①\nア…人気の高まり＝需要の増加なので、需要曲線は右上のD'へシフトする。\nイ…スニーカーの価格は30%増（10,000円×1.3＝13,000円）、数量は20%増（8,000足×1.2＝9,600足）となる。したがって売上総額は 13,000円×9,600足＝1億2,480万円 となる。シフト前の売上総額は 10,000円×8,000足＝8,000万円 なので、売上総額の変化量は 1億2,480万円－8,000万円＝4,480万円 である。"}, {"id": "c3_q3", "number": 3, "theme": "市場原理", "source": "政経, 倫理・政経追試", "question_text": "次の図はある製品の需要曲線と供給曲線を実線で描いたものであり、当初の市場均衡点はEである。まず、その製品を生産するために使用する原材料の価格が下落し、市場均衡点が変化した。その後、その製品に対する人気が落ちたことにより、再び市場均衡点が変化した。これ以外の条件が変化しないと仮定し、均衡点が図中のA〜Iしか存在しない場合、このときの市場均衡点の変化の順番として正しいものを、次の①〜⑧のうちから一つ選べ。", "material": {"type": "diagram_html", "content": "<div class=\"my-3 p-3 bg-slate-50 border rounded text-center\">\n  <div class=\"text-xs text-slate-500 mb-2\">【市場均衡点Eのシフト】</div>\n  <svg viewBox=\"0 0 300 220\" class=\"w-full max-w-xs mx-auto border bg-white\">\n    <line x1=\"40\" y1=\"190\" x2=\"280\" y2=\"190\" stroke=\"#334155\" stroke-width=\"2\"/>\n    <line x1=\"40\" y1=\"190\" x2=\"40\" y2=\"20\" stroke=\"#334155\" stroke-width=\"2\"/>\n    <text x=\"30\" y=\"25\" font-size=\"11\" fill=\"#334155\" font-weight=\"bold\">価格</text>\n    <text x=\"255\" y=\"205\" font-size=\"11\" fill=\"#334155\" font-weight=\"bold\">数量</text>\n    <!-- Supply Curve (positive slope) -->\n    <line x1=\"60\" y1=\"170\" x2=\"240\" y2=\"50\" stroke=\"#2563eb\" stroke-width=\"2\"/>\n    <text x=\"180\" y=\"55\" font-size=\"10\" fill=\"#2563eb\">供給曲線</text>\n    <!-- Demand Curve (negative slope) -->\n    <line x1=\"60\" y1=\"50\" x2=\"240\" y2=\"170\" stroke=\"#dc2626\" stroke-width=\"2\"/>\n    <text x=\"50\" y=\"45\" font-size=\"10\" fill=\"#dc2626\">需要曲線</text>\n    <!-- Points Grid around E (150, 110) -->\n    <!-- Center E -->\n    <circle cx=\"150\" cy=\"110\" r=\"4\" fill=\"#0f172a\"/><text x=\"156\" y=\"108\" font-size=\"11\" font-weight=\"bold\">E</text>\n    <!-- Left B -->\n    <circle cx=\"110\" cy=\"110\" r=\"3\" fill=\"#64748b\"/><text x=\"96\" y=\"114\" font-size=\"10\">B</text>\n    <!-- Right F -->\n    <circle cx=\"190\" cy=\"110\" r=\"3\" fill=\"#64748b\"/><text x=\"196\" y=\"114\" font-size=\"10\">F</text>\n    <!-- Top C -->\n    <circle cx=\"150\" cy=\"70\" r=\"3\" fill=\"#64748b\"/><text x=\"146\" y=\"65\" font-size=\"10\">C</text>\n    <!-- Bottom G -->\n    <circle cx=\"150\" cy=\"150\" r=\"3\" fill=\"#64748b\"/><text x=\"146\" y=\"165\" font-size=\"10\">G</text>\n    <!-- TopLeft A -->\n    <circle cx=\"110\" cy=\"70\" r=\"3\" fill=\"#64748b\"/><text x=\"100\" y=\"68\" font-size=\"10\">A</text>\n    <!-- BottomLeft D -->\n    <circle cx=\"110\" cy=\"150\" r=\"3\" fill=\"#64748b\"/><text x=\"100\" y=\"158\" font-size=\"10\">D</text>\n    <!-- TopRight I -->\n    <circle cx=\"190\" cy=\"70\" r=\"3\" fill=\"#64748b\"/><text x=\"196\" y=\"68\" font-size=\"10\">I</text>\n    <!-- BottomRight H -->\n    <circle cx=\"190\" cy=\"150\" r=\"3\" fill=\"#64748b\"/><text x=\"196\" y=\"158\" font-size=\"10\">H</text>\n  </svg>\n</div>"}, "options": ["E → B → A", "E → B → C", "E → D → A", "E → D → G", "E → F → C", "E → F → I", "E → H → G", "E → H → I"], "correct_answer": 7, "explanation": "正解：⑦\n原材料の価格が下落すると、供給曲線が右側（右下）へシフトするので、均衡点はHとなる。その後、その製品の人気が落ちると、需要曲線は左側（左下）へシフトするので均衡点はGに移動する。したがって、均衡点は E → H → G と変化する。"}, {"id": "c3_q4", "number": 4, "theme": "市場原理", "source": "公共, 政経本試", "question_text": "生徒Xは、ある仮想的な農産物の国内市場における価格の決まり方について考え、この農産物の2025年の農家の売上げとその増減に関する考察を述べた次の資料を作成した。資料中の空欄[ ア ]に当てはまる金額と空欄[ イ ]に当てはまる語句の組合せとして正しいものを、後の①〜⑥のうちから一つ選べ。", "material": {"type": "complex_data", "content": "<div class=\"border p-3 rounded bg-slate-50 text-xs text-slate-800 space-y-2\">\n  <div class=\"font-bold text-center\">【仮定】</div>\n  <div>○この農産物の2023年〜2025年の生産量と価格は、次の表のとおりとする。</div>\n  <table class=\"w-full text-center border-collapse border border-slate-300 bg-white\">\n    <tr class=\"bg-slate-100\">\n      <th class=\"border border-slate-300 p-1\"></th>\n      <th class=\"border border-slate-300 p-1\">2023年</th>\n      <th class=\"border border-slate-300 p-1\">2024年</th>\n      <th class=\"border border-slate-300 p-1\">2025年(見込み)</th>\n    </tr>\n    <tr>\n      <td class=\"border border-slate-300 p-1 font-semibold\">生産量 (万単位)</td>\n      <td class=\"border border-slate-300 p-1\">300</td>\n      <td class=\"border border-slate-300 p-1\">400</td>\n      <td class=\"border border-slate-300 p-1\">800</td>\n    </tr>\n    <tr>\n      <td class=\"border border-slate-300 p-1 font-semibold\">1単位当たり価格 (円)</td>\n      <td class=\"border border-slate-300 p-1\">70</td>\n      <td class=\"border border-slate-300 p-1\">60</td>\n      <td class=\"border border-slate-300 p-1 font-bold text-blue-600\">x</td>\n    </tr>\n  </table>\n  <div>○この農産物は保存がきかず、輸出入はなく、かつその生産量は年ごとに変動し、各農家は収穫（生産）された全量をそのまま市場に出荷するものとする。</div>\n  <div>○この農産物の需要曲線は、右下がりの直線で与えられるものとする。</div>\n  <div class=\"p-2 bg-amber-50 rounded border border-amber-200\">\n    2024年と比較した2025年の全農家の売上総額は、1単位当たり価格がx円となるので、<strong>[ ア ]</strong>だけ<strong>[ イ ]</strong>すると見込まれる。なお、この農産物を生産する全農家の売上総額は、価格と販売量の積で求められる。\n  </div>\n</div>"}, "options": ["ア 8千万円　イ 増加", "ア 8千万円　イ 減少", "ア 1億6千万円　イ 増加", "ア 1億6千万円　イ 減少", "ア 2億4千万円　イ 増加", "ア 2億4千万円　イ 減少"], "correct_answer": 2, "explanation": "正解：②\nまずxを求めると、表およびグラフから生産量が100万単位増えると1単位当たり価格が10円下がっているので、2024年から2025年にかけて生産量が400万単位増えると、1単位当たり価格は40円下がり x＝20円 となる。\n次に、2024年の売上総額は 60円×400万＝2億4千万円。\n2025年の売上総額は 20円×800万＝1億6千万円。\nしたがって、売上総額は「8千万円」（ア）だけ「減少」（イ）すると見込まれる。"}, {"id": "c3_q5", "number": 5, "theme": "寡占市場", "source": "政経, 倫理・政経本試", "question_text": "寡占市場がもつ特徴についての記述として適当でないものを、次の①〜④のうちから一つ選べ。", "options": ["管理価格とは、市場メカニズムによらずに、価格支配力をもつプライス・リーダーが人為的に決定する価格のことである。", "価格の下方硬直性とは、生産技術の向上などで生産コストが低下しても、価格が下方に変化しにくくなることである。", "非価格競争とは、デザイン、広告・宣伝といった手段を用いて、価格以外の競争が行われることである。", "カルテルとは、資本の集中・集積が進み、同一産業内での企業合併が起こることである。"], "correct_answer": 4, "explanation": "正解：④\n④不適当 「同一産業内での企業合併」はトラストである。カルテルとは、同一産業内の複数の企業が販売価格や取引数量に関して協定を結ぶことによって市場支配をはかることである。①②③はいずれも適当。"}, {"id": "c3_q6", "number": 6, "theme": "非価格競争", "source": "政経, 倫理・政経追試", "question_text": "市場における非価格競争の例として最も適当なものを、次の①〜④のうちから一つ選べ。", "options": ["同業他社との間でカルテルを締結して、生産量の割当てを行う。", "人気俳優をテレビ広告に起用して、製品の販売拡大を図る。", "他社と同じ性能をもつ製品を、より安い値段で発売する。", "政府が定めた価格で、決められた規格の商品を販売する。"], "correct_answer": 2, "explanation": "正解：②\n非価格競争とは、広告や宣伝、機能やデザインの差異化など価格以外の競争をすることであり、②が該当する。\n①は独占禁止法で禁止される競争の制限（不当な取引制限）。③は価格競争。④は公定価格。"}, {"id": "c3_q7", "number": 7, "theme": "市場の失敗", "source": "政経, 倫理・政経本試", "question_text": "次の記述ア〜ウのうち、市場の失敗の例として正しいものはどれか。当てはまるものをすべて選び、その組合せとして最も適当なものを、後の①〜⑦のうちから一つ選べ。", "material": {"type": "statements", "content": "ア 市場で特定の企業の支配が進み、その企業が価格支配力をもつ。\nイ ある企業の周辺の住民が、対価を受け取ることなく企業活動による不利益を被る。\nウ 市場で取引を行う場合、売り手がもっている情報をすべて買い手ももっている。"}, "options": ["ア", "イ", "ウ", "アとイ", "アとウ", "イとウ", "アとイとウ"], "correct_answer": 4, "explanation": "正解：④\nア…独占市場、寡占市場は典型的な市場の失敗の例である。\nイ…公害や環境問題のような「外部不経済」も市場の失敗の例である。\nウ…「売り手がもっている情報をすべて買い手ももっている」状況は完全情報の状態であり、市場の失敗の原因である「情報の非対称性」には該当しない。よってアとイが正しく、正解は④となる。"}, {"id": "c3_q8", "number": 8, "theme": "市場の失敗", "source": "政経追試", "question_text": "生徒Xのグループは、国内経済の課題に関して検討した際に「外部経済」「外部不経済」「情報の非対称性」「独占・寡占」に起因する市場の失敗に関心をもった。Xのグループは、発表時の資料とするため市場の失敗の事例と思われるものとして、次のア〜エのカードを作成した。「情報の非対称性」と関連するカードとして最も適当なものを、次の①〜④のうちから一つ選べ。", "material": {"type": "cards", "content": "<div class=\"space-y-2 text-xs text-slate-800\">\n  <div class=\"p-2 border rounded bg-slate-50\"><strong>ア</strong> 携帯電話の発売開始当初は、事業者が一社だった。その後も数社に限定されていた。乗用車の生産も数社でほとんどを占めている。事業者が少数の時は、市場メカニズムが働きにくい。</div>\n  <div class=\"p-2 border rounded bg-slate-50\"><strong>イ</strong> 中古車の売買では、買い手が売り手に聞かない限りわからない修復歴やエンジンの不具合などがありうるので、買い手が見た目だけでは中古車の良し悪しを判断できない場合も多い。</div>\n  <div class=\"p-2 border rounded bg-slate-50\"><strong>ウ</strong> 最近、近くに工場ができて、大型トラックの通行量が増えた。この工場に出入りするトラックの通行によって交通渋滞が頻繁に発生し、交通事故の件数も工場ができる前に比べて増加した。</div>\n  <div class=\"p-2 border rounded bg-slate-50\"><strong>エ</strong> 各家庭が夜間に街路に面した外灯を点灯することにより、この地域の夜間における犯罪の発生件数が減少した。地域住民らは、以前よりも安心して生活できるようになった。</div>\n</div>"}, "options": ["ア", "イ", "ウ", "エ"], "correct_answer": 2, "explanation": "正解：②\nイ…中古車市場のように、商品やサービスの売り手と買い手との間で保有する情報の量や質に格差があることを「情報の非対称性」という。\nア…「独占・寡占」の例。\nウ…ある経済主体の行動が市場を通さずに第三者にマイナスの影響を与える「外部不経済」の例。\nエ…ある経済主体の行動が市場を通さずに第三者にプラスの影響を与える「外部経済」の例。"}, {"id": "c3_q9", "number": 9, "theme": "公共財の性質", "source": "政経, 倫理・政経本試", "question_text": "公共財の性質の一つである非排除性についての記述として最も適当なものを、次の①〜④のうちから一つ選べ。", "options": ["他の人々の消費を減らすことなく、複数の人々が同時に消費できる。", "価格が上がっても、需要量はあまり低下しない。", "だれも利用を制限されない。", "供給量が不足しても、価格が変化しない。"], "correct_answer": 3, "explanation": "正解：③\n③適当 非排除性とは、対価を支払わなくてもだれもが財を消費できる（利用を制限されない）性質のこと。\n①は公共財のもう一つの性質である非競合性の説明。"}, {"id": "c3_q10", "number": 10, "theme": "非競合性と非排除性", "source": "現社第1回", "question_text": "様々な財・サービスについて、非競合性と非排除性をもつかどうかを次の表にまとめた。表のア〜ウと、そこに入るものA〜Cの組合せとして最も適当なものを、次の①〜⑥のうちから一つ選べ。", "material": {"type": "matrix_and_items", "content": "<div class=\"my-2\">\n  <table class=\"w-full text-center border-collapse border border-slate-300 text-xs bg-white\">\n    <tr>\n      <th class=\"border border-slate-300 p-2 bg-slate-100\" colspan=\"2\" rowspan=\"2\"></th>\n      <th class=\"border border-slate-300 p-2 bg-slate-100\" colspan=\"2\">非排除性</th>\n    </tr>\n    <tr>\n      <th class=\"border border-slate-300 p-1 bg-slate-50\">もつ</th>\n      <th class=\"border border-slate-300 p-1 bg-slate-50\">もたない</th>\n    </tr>\n    <tr>\n      <th class=\"border border-slate-300 p-2 bg-slate-100\" rowspan=\"2\">非競合性</th>\n      <th class=\"border border-slate-300 p-1 bg-slate-50\">もつ</th>\n      <td class=\"border border-slate-300 p-2 font-bold text-blue-600 bg-blue-50\">ア</td>\n      <td class=\"border border-slate-300 p-2 font-bold text-blue-600 bg-blue-50\">イ</td>\n    </tr>\n    <tr>\n      <th class=\"border border-slate-300 p-1 bg-slate-50\">もたない</th>\n      <td class=\"border border-slate-300 p-2 font-bold text-blue-600 bg-blue-50\">ウ</td>\n      <td class=\"border border-slate-300 p-2 text-slate-600\">食料品・衣服など</td>\n    </tr>\n  </table>\n  <div class=\"mt-2 text-xs bg-slate-50 p-2 rounded border border-slate-200\">\n    <div><strong>A</strong> ケーブルテレビの有料チャンネル</div>\n    <div><strong>B</strong> 自由に釣りをしてもよい小さな池にいる魚</div>\n    <div><strong>C</strong> 岬の灯台</div>\n  </div>\n</div>"}, "options": ["ア-A　イ-B　ウ-C", "ア-A　イ-C　ウ-B", "ア-B　イ-A　ウ-C", "ア-B　イ-C　ウ-A", "ア-C　イ-A　ウ-B", "ア-C　イ-B　ウ-A"], "correct_answer": 5, "explanation": "正解：⑤\nA…ケーブルテレビの有料チャンネルは、複数の利用者が同時に利用できるので非競合性をもつが、料金を支払わないと利用できないので非排除性はもたない。よってイに該当する。\nB…「自由に釣り」ができる点で非排除性をもつが、「小さな池にいる魚」は有限であり非競合性はもたない。よってウに該当する。\nC…岬の灯台は、非競合性と非排除性を合わせもつ公共財の代表例であり、アに該当する。"}], "speed_checks": [{"id": "c3_s1", "page": "p.68", "number": 1, "statement": "多数の買い手と買い手が自由競争を行っている市場では、一般に、供給が需要を超過すれば価格は低下する。", "answer": true, "explanation": "正しい。供給過剰（超過供給）の状態では、価格は下落して均衡へ向かう。"}, {"id": "c3_s2", "page": "p.68", "number": 2, "statement": "完全競争市場において供給が需要を超過している場合は、価格が均衡価格まで上昇して、需要と供給が一致する。", "answer": false, "explanation": "誤り。供給が需要を超過している（超過供給）場合、価格は「下落」して均衡価格で一致する。"}, {"id": "c3_s3", "page": "p.68", "number": 3, "statement": "完全競争市場における価格競争は、価格の切下げ競争として行われ、価格はプライス・リーダーの設定する水準に決まる。", "answer": false, "explanation": "誤り。プライス・リーダー（価格先導者）が存在して管理価格が形成されるのは「寡占市場」の特徴である。"}, {"id": "c3_s4", "page": "p.68", "number": 4, "statement": "寡占市場では価格競争が行われにくく弊害が生じやすいので、独占禁止法に基づき公正取引委員会が公正な取引価格を決めている。", "answer": false, "explanation": "誤り。公正取引委員会は市場の公正かつ自由な競争を確保する機関であり、個別の商品の取引価格を決定することはない。"}, {"id": "c3_s5", "page": "p.68", "number": 5, "statement": "寡占市場での非価格競争には、広告・宣伝の活用や、デザイン、品質、ブランドなどによる製品差別化がある。", "answer": true, "explanation": "正しい。寡占市場では価格競争が回避され、広告・デザイン・ブランドなどによる非価格競争が活発になる。"}, {"id": "c3_s6", "page": "p.68", "number": 6, "statement": "需要の拡大した財やサービスの市場においては、価格が上昇し生産量が増大する。", "answer": true, "explanation": "正しい。需要曲線の右シフトにより、均衡価格が上昇し取引量（生産量）も増加する。"}, {"id": "c3_s7", "page": "p.68", "number": 7, "statement": "生産に必要な原材料の価格が上昇した財やサービスの市場においては、価格が上昇し生産量が減少する。", "answer": true, "explanation": "正しい。供給曲線の左（上）シフトにより、価格が上昇し取引量（生産量）は減少する。"}, {"id": "c3_s8", "page": "p.68", "number": 8, "statement": "住宅建設のための土地需要が高まった地域においては、地価が上昇し、住宅向けの土地供給が減少する。", "answer": false, "explanation": "誤り。土地需要の高まりにより地価が上昇すれば、住宅向けの土地供給量は増加する。"}, {"id": "c3_s9", "page": "p.68", "number": 9, "statement": "生産物に間接税を課した場合、生産物1単位当たりの費用が間接税分だけ上がるため、供給曲線が右側に動く。", "answer": false, "explanation": "誤り。間接税が課されると生産コストが上がるため、供給曲線は「上側（左側）」にシフトする。"}, {"id": "c3_s10", "page": "p.68", "number": 10, "statement": "生産物に間接税を課した場合、間接税は消費者が生産者に支払うが、生産者が納税するため、需要曲線、供給曲線とも動かない。", "answer": false, "explanation": "誤り。生産物への間接税課税により供給曲線が上にシフトし、価格上昇と取引量減少が起きる。"}, {"id": "c3_s11", "page": "p.68", "number": 11, "statement": "公共財は、非競合性と非排除性とを有している財・サービスと定義される。", "answer": true, "explanation": "正しい。純粋公共財は「非競合性」（同時消費が可能）と「非排除性」（対価を払わない者を排除できない）を併せ持つ。"}, {"id": "c3_s12", "page": "p.69", "number": 1, "statement": "「市場機構をできるだけ機能させるように、政府は行政指導を抑制すべきである」という考え方は、小さな政府を志向するものといえる。", "answer": true, "explanation": "正しい。市場の自由競争を重視し、政府の介入や行政指導を最小限に抑える立場は「小さな政府」の考え方である。"}, {"id": "c3_s13", "page": "p.69", "number": 2, "statement": "タクシー料金を弾力的に設定することができるようになり、利用者の選択の幅が広がった場合、市場がより競争的になったといえる。", "answer": true, "explanation": "正しい。価格規制の緩和により料金設定の自由度が増し、事業者の競争が促進される。"}, {"id": "c3_s14", "page": "p.69", "number": 3, "statement": "製品差別化が進んだ商品の市場では、均質な商品の市場と比較して、価格競争が行われやすい。", "answer": false, "explanation": "誤り。製品差別化が進んだ市場では、品質やブランドによる非価格競争が中心となり、価格競争は起こりにくくなる。"}, {"id": "c3_s15", "page": "p.69", "number": 4, "statement": "管理価格が成立している寡占市場では、プライス・リーダーの設定した価格に他の売手も追従する傾向がある。", "answer": true, "explanation": "正しい。有力なプライス・リーダーが定めた価格に他社が追従することで管理価格が形成される。"}, {"id": "c3_s16", "page": "p.69", "number": 5, "statement": "寡占市場における商品の価格は、仮にその市場が競争的な市場であればつくであろう価格よりも、一般に高い。", "answer": true, "explanation": "正しい。寡占市場では価格競争が抑制され下方硬直性が生じるため、競争市場よりも価格が高止まりする。"}, {"id": "c3_s17", "page": "p.69", "number": 6, "statement": "預金金利を自由化することは、一般に、預金の獲得をめぐる銀行間の競争を促進する効果をもつ。", "answer": true, "explanation": "正しい。金利自由化により、各銀行が独自の魅力的な金利を提示して預金者を競い合うようになる。"}, {"id": "c3_s18", "page": "p.69", "number": 7, "statement": "大企業同士の合併を制限することは、一般に、市場に大きな影響を与える巨大な企業の出現を抑制し、市場を競争的な状態に保つ効果をもつ。", "answer": true, "explanation": "正しい。独禁法による企業結合規制は、市場集中度の上昇を防ぎ競争的な環境を維持するためにある。"}, {"id": "c3_s19", "page": "p.69", "number": 8, "statement": "ある産業に企業が参入する際に必要な許認可手続きを簡素化することは、一般に、企業の新規参入を容易にして競争を促進する効果をもつ。", "answer": true, "explanation": "正しい。許認可等の参入障壁の緩和は新規参入を促し、市場競争を活性化させる。"}, {"id": "c3_s20", "page": "p.69", "number": 9, "statement": "不況カルテルの結成を認めることは、一般に、不況期の価格競争を促進する効果をもつ。", "answer": false, "explanation": "誤り。不況カルテルは不況期における過度な価格競争や倒産を防ぐために生産制限や価格維持を行うものであり、価格競争を促進するものではない（現在は独禁法上廃止）。"}, {"id": "c3_s21", "page": "p.69", "number": 10, "statement": "少数の大企業が市場を支配すると、一般に、その市場での競争が激化し、資源配分がより効率的になる。", "answer": false, "explanation": "誤り。少数の大企業による寡占市場では価格競争が停滞し、資源配分の効率性が損なわれる（市場の失敗）。"}, {"id": "c3_s22", "page": "p.69", "number": 11, "statement": "年末の帰省客の増加による高速バスのチケット価格の値上がりは、競争的な市場における需要曲線のシフトによる均衡価格の変化に該当する。", "answer": true, "explanation": "正しい。帰省シーズンによる一時的な需要急増（需要曲線右シフト）に伴う市場均衡価格の上昇である。"}, {"id": "c3_s23", "page": "p.70", "number": 1, "statement": "利用者から料金を徴収することの困難な灯台は、市場メカニズムの下では適切な供給がなされない公共財の代表例である。", "answer": true, "explanation": "正しい。灯台は非排除性・非競合性をもつ純粋公共財であり、市場に任せると過小供給となるため政府が供給する。"}, {"id": "c3_s24", "page": "p.70", "number": 2, "statement": "人々の生活必需品である穀物は、市場メカニズムの下では適切な供給がなされない公共財の代表例である。", "answer": false, "explanation": "誤り。穀物は対価を払わなければ得られず（排除性）、消費すればなくなる（競合性）ため私的財である。"}, {"id": "c3_s25", "page": "p.70", "number": 3, "statement": "駅の新設によって、近隣の商店街の売上げが伸びることは、外部経済の例である。", "answer": true, "explanation": "正しい。市場取引を介さずに第三者にプラスの便益をもたらす「外部経済」の典型例である。"}, {"id": "c3_s26", "page": "p.70", "number": 4, "statement": "農家が稲作を行うことによって、自然環境の保全に寄与することは、外部経済の例である。", "answer": true, "explanation": "正しい。農業の持つ多面的機能（洪水防止、環境保全など）は外部経済である。"}, {"id": "c3_s27", "page": "p.70", "number": 5, "statement": "同業商店間の競争によって、消費者が安価な商品を入手できることは、外部経済の例である。", "answer": false, "explanation": "誤り。市場での自由競争による価格低下は市場メカニズムを通じた結果であり、市場を介さない外部効果（外部経済）ではない。"}, {"id": "c3_s28", "page": "p.70", "number": 6, "statement": "「規模の利益（規模の経済）」が強く働く産業において独占が成立することは、外部不経済の例といえる。", "answer": false, "explanation": "誤り。規模の経済による独占は「自然独占」の例であり、外部不経済ではない。"}, {"id": "c3_s29", "page": "p.70", "number": 7, "statement": "上流の工場からの廃液によって下流の漁場の漁獲高が減少することは、外部不経済の例といえる。", "answer": true, "explanation": "正しい。市場を通さずに第三者に損害や不利益を与える典型的な「外部不経済」（公害）である。"}, {"id": "c3_s30", "page": "p.70", "number": 8, "statement": "企業が、独占や寡占によって、自らに有利な管理価格を形成することは、市場の失敗の例といえる。", "answer": true, "explanation": "正しい。独占・寡占による不完全競争は市場メカニズムを損なう「市場の失敗」の一つである。"}, {"id": "c3_s31", "page": "p.70", "number": 9, "statement": "工場の建設により、周囲の生活環境が阻害されることは、市場の失敗の例といえる。", "answer": true, "explanation": "正しい。外部不経済（環境悪化・騒音等）は市場の失敗に該当する。"}, {"id": "c3_s32", "page": "p.70", "number": 10, "statement": "生産の効率化が進展した産業で、製品価格が下落することは、市場の失敗の例といえる。", "answer": false, "explanation": "誤り。生産技術の向上に伴う価格下落は市場メカニズムが適切に機能している結果である。"}, {"id": "c3_s33", "page": "p.70", "number": 11, "statement": "企業が、地球環境への負荷の小さい自動車エンジンの開発費を増やしたところ、その企業の利潤が減少したのは外部不経済の例といえる。", "answer": false, "explanation": "誤り。自社の開発費増加による利潤減少は企業内部の経済活動の費用であり、外部不経済ではない。"}, {"id": "c3_s34", "page": "p.70", "number": 12, "statement": "公共財の特徴である非競合性とは、「同じ財やサービスを複数の消費者が同時に消費できる」ということである。", "answer": true, "explanation": "正しい。ある人の消費が他の人の消費分を減らさない性質を非競合性と呼ぶ。"}]}, {"id": "cat4", "title": "国民所得 / 景気と物価", "page_range": "p.71〜73", "questions": [{"id": "c4_q1", "number": 1, "theme": "国富", "source": "政経, 倫理・政経追試", "question_text": "国民経済計算において国富を構成するものとして誤っているものを、次の①〜④のうちから一つ選べ。ただし、対外的な経済関係は考えないものとする。", "options": ["世帯が保有する住宅", "世帯が保有する株式", "企業が保有する商標権", "政府が保有する道路"], "correct_answer": 2, "explanation": "正解：②\n②誤り 一国の国富を構成するのは、再生産可能な有形資産（住宅や道路、機械などの固定資産や在庫品）、再生産不可能な有形資産（土地や地下資源など）、無形非金融資産（特許権、商標権、著作権など）、および対外純資産（対外資産と対外負債の差額）である。国内の金融資産（通貨、株式、債券など）は、資産と負債の両面がある（誰かの貸しは他の誰かの借りということ。たとえば、株式は株主にとって資産だが、企業にとっては負債である）ため国富に含めない。"}, {"id": "c4_q2", "number": 2, "theme": "一国の資産と国富", "source": "政経第2回", "question_text": "次の表はある国における国全体の資産（非金融資産および金融資産）と負債、それらの差額である国富を示しており、通貨の単位にはドルを用いているものとする。この表を正しく読みとった場合、それを前提に推論した記述として最も適当なものを、次の①〜④のうちから一つ選べ。", "material": {"type": "table_html", "content": "<div class=\"overflow-x-auto my-2 text-xs\">\n  <div class=\"text-right text-slate-500 mb-1\">(単位: 10億ドル)</div>\n  <table class=\"w-full text-center border-collapse border border-slate-300 bg-white\">\n    <thead>\n      <tr class=\"bg-slate-100\">\n        <th class=\"border border-slate-300 p-1\" colspan=\"2\"></th>\n        <th class=\"border border-slate-300 p-1\">2015年</th>\n        <th class=\"border border-slate-300 p-1\">2016年</th>\n        <th class=\"border border-slate-300 p-1\">2017年</th>\n        <th class=\"border border-slate-300 p-1\">2018年</th>\n      </tr>\n    </thead>\n    <tbody>\n      <tr>\n        <td class=\"border border-slate-300 p-1 font-semibold\" rowspan=\"3\">非金融資産 (実物資産)</td>\n        <td class=\"border border-slate-300 p-1\">計</td>\n        <td class=\"border border-slate-300 p-1\">3,150</td>\n        <td class=\"border border-slate-300 p-1\">3,100</td>\n        <td class=\"border border-slate-300 p-1\">3,090</td>\n        <td class=\"border border-slate-300 p-1\">3,050</td>\n      </tr>\n      <tr>\n        <td class=\"border border-slate-300 p-1 text-slate-600\">うち在庫</td>\n        <td class=\"border border-slate-300 p-1\">60</td>\n        <td class=\"border border-slate-300 p-1\">70</td>\n        <td class=\"border border-slate-300 p-1\">100</td>\n        <td class=\"border border-slate-300 p-1\">200</td>\n      </tr>\n      <tr>\n        <td class=\"border border-slate-300 p-1 text-slate-600\">うち土地</td>\n        <td class=\"border border-slate-300 p-1\">1,400</td>\n        <td class=\"border border-slate-300 p-1\">1,310</td>\n        <td class=\"border border-slate-300 p-1\">1,200</td>\n        <td class=\"border border-slate-300 p-1\">1,150</td>\n      </tr>\n      <tr class=\"bg-slate-50\">\n        <td class=\"border border-slate-300 p-1 font-semibold\" rowspan=\"2\">金融資産</td>\n        <td class=\"border border-slate-300 p-1\">計</td>\n        <td class=\"border border-slate-300 p-1\">6,900</td>\n        <td class=\"border border-slate-300 p-1\">6,130</td>\n        <td class=\"border border-slate-300 p-1\">5,990</td>\n        <td class=\"border border-slate-300 p-1\">5,800</td>\n      </tr>\n      <tr class=\"bg-slate-50\">\n        <td class=\"border border-slate-300 p-1 text-slate-600\">うちマネーストック</td>\n        <td class=\"border border-slate-300 p-1\">1,950</td>\n        <td class=\"border border-slate-300 p-1\">1,700</td>\n        <td class=\"border border-slate-300 p-1\">1,550</td>\n        <td class=\"border border-slate-300 p-1\">1,400</td>\n      </tr>\n      <tr>\n        <td class=\"border border-slate-300 p-1 font-semibold\" colspan=\"2\">負債</td>\n        <td class=\"border border-slate-300 p-1\">6,500</td>\n        <td class=\"border border-slate-300 p-1\">5,800</td>\n        <td class=\"border border-slate-300 p-1\">5,700</td>\n        <td class=\"border border-slate-300 p-1\">5,600</td>\n      </tr>\n      <tr class=\"bg-amber-50 font-bold\">\n        <td class=\"border border-slate-300 p-1\" colspan=\"2\">国富</td>\n        <td class=\"border border-slate-300 p-1\">3,550</td>\n        <td class=\"border border-slate-300 p-1\">3,430</td>\n        <td class=\"border border-slate-300 p-1\">3,380</td>\n        <td class=\"border border-slate-300 p-1\">3,250</td>\n      </tr>\n    </tbody>\n  </table>\n  <div class=\"text-[10px] text-slate-500 mt-1\">(注) 表中の数値は2015年を基準として実質化しているものとする。</div>\n</div>"}, "options": ["表の期間中に「在庫」の変化の傾向が継続し、表以外の他の条件が一定だった場合、この期間は景気の谷から山に向かう時期であったと考えられる。", "表の期間中に「土地」の変化の傾向が継続し、逆資産効果が働いた場合、消費は減少したことになる。", "表の期間中に「マネーストック」の変化の傾向が継続し、その変化が金融政策によるものであった場合、金融緩和政策がとられていたと考えられる。", "表の期間中に「国富」の変化の傾向が継続し、表以外の他の条件が一定だった場合、非金融資産（実物資産）と対外純資産の合計は増加したことになる。"], "correct_answer": 2, "explanation": "正解：②\n②適当 資産価値の減少によって消費が抑制されることを逆資産効果という。表から土地の資産価格の総計が減少していることがわかるので、逆資産効果が働き消費は抑制されることになる。\n①不適当 在庫が増えているので、景気が下降すなわち山から谷に向かう時期であったと考えられる。\n③不適当 マネーストックは減少しているので、金融政策としては金融引き締め策がとられていると考えられる。\n④不適当 国富は減少しており、非金融資産（実物資産）と対外純資産の合計は減少したことになる。"}, {"id": "c4_q3", "number": 3, "theme": "GDP", "source": "政経, 倫理・政経追試", "question_text": "経済発展を数量的に表すために利用するGDP（国内総生産）に関する記述として最も適当なものを、次の①〜④のうちから一つ選べ。", "options": ["GDPに海外から受け取った所得を加え、海外へ支払った所得を差し引いたものが、NNP（国民純生産）である。", "一国の経済規模を測るGDPは、ストックの量である。", "GDPに家事労働や余暇などの価値を加えたものは、グリーンGDPと呼ばれる。", "物価変動の影響を除いたGDPは、実質GDPと呼ばれる。"], "correct_answer": 4, "explanation": "正解：④\n④適当 物価変動の影響を除いたGDPは実質GDPであり、実質GDP＝名目GDP÷GDPデフレーター×100 で表される。\n①不適当 NNPではなくGNP（国民総生産）あるいはGNI（国民総所得）である。\n②不適当 GDPは一定期間（通常1年間）における経済活動の成果を表すフローの指標である（ストックではない）。\n③不適当 家事労働や余暇などを加えた指標はNNW（国民純福祉）である。グリーンGDPは環境悪化や自然資源の減少を差し引いた指標。"}, {"id": "c4_q4", "number": 4, "theme": "GDP", "source": "政経, 倫理・政経追試", "question_text": "次の表は、ある国の一年間の産業別の財・サービスの総生産額と中間生産物の価額を示している。表中の総生産額には海外で生産されたものは含まれていない。今、この国のGDPの総額が4,000と計算されるとき、第二次産業の中間生産物の価額Aとして正しいものを、次の①〜④のうちから一つ選べ。", "material": {"type": "table_html", "content": "<div class=\"my-2 max-w-sm mx-auto text-xs\">\n  <table class=\"w-full text-center border-collapse border border-slate-300 bg-white\">\n    <thead>\n      <tr class=\"bg-slate-100\">\n        <th class=\"border border-slate-300 p-2\"></th>\n        <th class=\"border border-slate-300 p-2\">総生産額</th>\n        <th class=\"border border-slate-300 p-2\">中間生産物の価額</th>\n      </tr>\n    </thead>\n    <tbody>\n      <tr>\n        <td class=\"border border-slate-300 p-2 font-semibold\">第一次産業</td>\n        <td class=\"border border-slate-300 p-2\">1,300</td>\n        <td class=\"border border-slate-300 p-2\">600</td>\n      </tr>\n      <tr>\n        <td class=\"border border-slate-300 p-2 font-semibold\">第二次産業</td>\n        <td class=\"border border-slate-300 p-2\">2,000</td>\n        <td class=\"border border-slate-300 p-2 font-bold text-blue-600 bg-blue-50\">A</td>\n      </tr>\n      <tr>\n        <td class=\"border border-slate-300 p-2 font-semibold\">第三次産業</td>\n        <td class=\"border border-slate-300 p-2\">3,500</td>\n        <td class=\"border border-slate-300 p-2\">1,100</td>\n      </tr>\n    </tbody>\n  </table>\n</div>"}, "options": ["600", "700", "1,100", "1,300"], "correct_answer": 3, "explanation": "正解：③\nGDP（国内総生産）＝国内における総生産額－中間生産物の総額 である。\n国内における総生産額は各産業の総生産額の合計であり、中間生産物の総額は各産業の中間生産物の価額の合計なので、\n4,000＝(1,300＋2,000＋3,500)－(600＋A＋1,100)\n4,000＝6,800－(1,700＋A)\n4,000＝5,100－A\nしたがって A＝1,100 となる。"}, {"id": "c4_q5", "number": 5, "theme": "GDP", "source": "現社第1回", "question_text": "日本のGDPに含まれるものを次のA〜Cからすべて選んだとき、その組合せとして最も適当なものを、次の①〜⑧のうちから一つ選べ。", "material": {"type": "statements", "content": "A 日本のプロ野球でプレーするアメリカ人選手に球団が支払った年俸\nB 日本人アーティストがイギリスで行ったコンサートの興行収入\nC 日本の温泉地を訪れた中国からの観光客が旅館に支払った宿泊料"}, "options": ["AとBとC", "AとB", "AとC", "BとC", "A", "B", "C", "日本のGDPに含まれるものはない"], "correct_answer": 3, "explanation": "正解：③\nGDP（国内総生産）は、日本国内で生み出された付加価値の総計なので、外国人が日本国内で生み出した付加価値は含まれるが、日本人が海外で生み出した付加価値は含まれない。よって、AとCは日本のGDPに含まれるが、Bは海外での収入なので含まれない。"}, {"id": "c4_q6", "number": 6, "theme": "GDPデフレーター", "source": "政経本試", "question_text": "生徒Xは、GDPデフレーターについて調べ、次のメモを作成した。メモ中の空欄[ ア ]には後の数値a〜dのいずれかが、空欄[ イ ]には後の語句eかfのいずれかが当てはまる。空欄[ ア ]・[ イ ]に当てはまるものの組合せとして最も適当なものを、次の①〜⑧のうちから一つ選べ。", "material": {"type": "memo", "content": "○GDPには名目GDPと実質GDPがある。\n○GDPデフレーターは、基準年の値を100とする物価変動の指標である。\n○たとえば、2010年の名目GDPは400兆円、2020年の名目GDPは540兆円、2010年の実質GDPは400兆円、2020年の実質GDPは360兆円である経済を考えた場合、2010年を基準年とした場合の、2020年のGDPデフレーターは[ ア ]である。\n○この結果をみると、基準年と比較して2020年の物価は[ イ ]したといえる。\n\n[ ア ]に当てはまる数値： a 66　b 90　c 135　d 150\n[ イ ]に当てはまる語句： e 上昇　f 下落"}, "options": ["ア-a　イ-e", "ア-a　イ-f", "ア-b　イ-e", "ア-b　イ-f", "ア-c　イ-e", "ア-c　イ-f", "ア-d　イ-e", "ア-d　イ-f"], "correct_answer": 7, "explanation": "正解：⑦\nア…実質GDP＝名目GDP÷GDPデフレーター×100 より、\nGDPデフレーター＝名目GDP÷実質GDP×100 となる。2020年の実質GDPは360兆円で名目GDPは540兆円なので、2020年のGDPデフレーター＝540÷360×100＝150 となり d が該当する。\nイ…基準年（100）よりもGDPデフレーターが増加している場合は物価が上昇したことになるので e が該当する。よって⑦（ア-d、イ-e）が正解。"}, {"id": "c4_q7", "number": 7, "theme": "国民所得の諸指標", "source": "政経本試", "question_text": "所得を把握するための諸指標に関する記述として誤っているものを、次の①〜④のうちから一つ選べ。", "options": ["分配面からみた国民所得（NI）の要素には、雇用者報酬が含まれる。", "支出面からみた国民所得の要素には、民間投資と政府投資が含まれる。", "国民総所得（GNI）は、国民純生産（NNP）から、固定資本減耗を差し引いたものである。", "国民総所得は、国民総生産（GNP）を分配面からとらえたものであり、両者は等価である。"], "correct_answer": 3, "explanation": "正解：③\n③誤り 国民総所得（GNI）＝国民純生産（NNP）＋固定資本減耗である（NNP＝GNI－固定資本減耗）。①②④はいずれも正しい。"}, {"id": "c4_q8", "number": 8, "theme": "景気循環", "source": "政経本試", "question_text": "景気循環の類型とそれが起こる主な要因についての記述として正しいものを、次の①〜④のうちから一つ選べ。", "options": ["クズネッツの波は、技術革新を主な要因として起こるとされる景気循環である。", "コンドラチェフの波は、在庫投資の変動を主な要因として起こるとされる景気循環である。", "キチンの波は、建設投資の変動を主な要因として起こるとされる景気循環である。", "ジュグラーの波は、設備投資の変動を主な要因として起こるとされる景気循環である。"], "correct_answer": 4, "explanation": "正解：④\n④正しい ジュグラーの波は、設備投資の変動によっておこる約10年周期の景気循環（中期波動）で、主循環ともいわれる。\n①誤り クズネッツの波は、住宅や施設の建て替えなど建設投資の変動による約20年周期の景気循環である。\n②誤り コンドラチェフの波は、技術革新を主な要因とする約50年周期の景気循環（長期波動）である。\n③誤り キチンの波は、在庫投資の変動によっておこる約40か月前後の景気循環（短期波動）である。"}, {"id": "c4_q9", "number": 9, "theme": "インフレーション", "source": "政経プレテスト", "question_text": "「物価の動き」に関連して、インフレーション（インフレ）の原因や影響についての記述として最も適当なものを、次の①〜④のうちから一つ選べ。", "options": ["インフレーションは、有効需要の減少により総需要が総供給を下回ることによって生じる。", "インフレーションは、労働生産性の上昇率が原材料や賃金といった生産コストの上昇率を上回ることによって生じる。", "インフレーションが生じると、借りていた奨学金の返済額が変わらなくても、返済の負担が実質的に減る。", "インフレーションが生じると、勤め先から支給される賃金額が変わらなくても、その賃金で購入できるものが増える。"], "correct_answer": 3, "explanation": "正解：③\n③適当 インフレーションが生じると貨幣価値が低下するので、借金の返済の負担も実質的に減る。\n①不適当 有効需要の減少により総需要が総供給を下回ると物価は下落する（デフレ）。\n②不適当 労働生産性の上昇率が原材料や賃金といった生産コストの上昇率を上回るとモノが安く生産できるので供給超過となり物価は下がる。\n④不適当 インフレーションが生じると貨幣価値が低下し実質購買力が低下するので、賃金額が変わらなければその賃金で購入できるものは減る。"}, {"id": "c4_q10", "number": 10, "theme": "物価の変動", "source": "政経本試", "question_text": "物価の変動が国民生活に影響を与える例として、インフレ（インフレーション）のケースについて調べ、次のメモにまとめた。メモ中の空欄[ ア ]〜[ エ ]に当てはまる語句の組合せとして正しいものを、次の①〜⑧のうちから一つ選べ。", "material": {"type": "memo", "content": "物価の変動は私たちの消費に影響を与える。私たちが買い物をするときを考え、名目の消費支出額を一定とする。すべての財・サービスの価格が同じ比率で変化したとすると、物価上昇前と比較して、物価上昇後に消費できる数量は[ ア ]することになる。\n物価の変動は、債権者や債務者に対しても影響を及ぼす。ある一定額のお金の貸借が行われている状況を想定する。金利が変化しなかったとして、貸借が行われた時点では想定されていなかったインフレが発生した場合について考える。このとき、インフレが発生しなかった場合と比較すると、債権者にとって経済的に[ イ ]に、債務者にとって経済的に[ ウ ]になる。\nこれは、支払われる金額が事前に確定しており、その後インフレが進行した場合、この債権・債務の価値が実質的に[ エ ]することになるからである。"}, "options": ["ア 増加　イ 有利　ウ 不利　エ 上昇", "ア 増加　イ 有利　ウ 不利　エ 下落", "ア 増加　イ 不利　ウ 有利　エ 上昇", "ア 増加　イ 不利　ウ 有利　エ 下落", "ア 減少　イ 有利　ウ 不利　エ 上昇", "ア 減少　イ 有利　ウ 不利　エ 下落", "ア 減少　イ 不利　ウ 有利　エ 上昇", "ア 減少　イ 不利　ウ 有利　エ 下落"], "correct_answer": 8, "explanation": "正解：⑧\nアは減少。消費支出額が一定なら、物価上昇後に消費できる数量は減少する。\nイは不利、ウは有利。インフレでお金の価値が下がるので、お金を貸している債権者にとって不利になり、お金を借りている債務者にとっては実質負担が減って有利になる。\nエは下落。お金の価値が下がる＝債権・債務の価値が経済的に下落することである。"}, {"id": "c4_q11", "number": 11, "theme": "物価の変動", "source": "政経, 倫理・政経本試", "question_text": "物価の変動に関する記述として正しいものを、次の①〜④のうちから一つ選べ。", "options": ["スタグフレーションとは、不況とデフレーションとが同時に進行する現象のことである。", "デフレスパイラルとは、デフレーションと好況とが相互に作用して進行する現象のことである。", "コスト・プッシュ・インフレーションは、生産費用の上昇が要因となって生じる。", "ディマンド・プル・インフレーションは、供給が需要を上回ることにより生じる。"], "correct_answer": 3, "explanation": "正解：③\n③正しい コスト・プッシュ・インフレーションは、賃金や原材料費の急激な上昇など生産コストの上昇によって生じるインフレである。\n①誤り スタグフレーションは、不況（スタグネーション）とインフレーション（物価上昇）が同時に進行する現象。\n②誤り デフレスパイラルは、デフレーションと不況が悪循環して進行する現象。\n④誤り ディマンド・プル・インフレーションは、総需要が総供給を上回る過剰需要により生じるインフレ。"}], "speed_checks": [{"id": "c4_s1", "page": "p.71", "number": 1, "statement": "国富はGDPや国民所得とともに政府によって算出される代表的なフロー統計であり、通常は1年間における平均資産額で表示される。", "answer": false, "explanation": "誤り。国富は特定の一時点における富の蓄積量を表す「ストック」の統計である（フローではない）。"}, {"id": "c4_s2", "page": "p.71", "number": 2, "statement": "国富は一国の資産の総計を示し、工場や機械などの生産設備のほかに、公園、学校などの生活関連の社会資本や住宅も算入されている。", "answer": true, "explanation": "正しい。実物資産として生産設備のほか、住宅や社会資本（道路、港湾、公園など）も国富に含まれる。"}, {"id": "c4_s3", "page": "p.71", "number": 3, "statement": "国富に土地は算入されていないので、地価が下落する時期に国富が増加することがある。", "answer": false, "explanation": "誤り。土地や森林などの再生産不可能な有形自然資産も国富に算入される。"}, {"id": "c4_s4", "page": "p.71", "number": 4, "statement": "国富の推計においては、国民生活に影響の大きい大気汚染や水質汚濁など自然環境条件の変化が金額評価され、加算あるいは控除されている。", "answer": false, "explanation": "誤り。大気汚染や水質汚濁などの自然環境の変化は現在の国富統計では評価・算入されていない。"}, {"id": "c4_s5", "page": "p.71", "number": 5, "statement": "GDPは一国の経済規模を把握するために、重複計算を避ける目的から、原材料などの中間生産物の金額を含まない付加価値総額を示すように工夫されている。", "answer": true, "explanation": "正しい。二重計算を避けるため、総生産額から原材料などの中間生産物額を控除した付加価値の合計がGDPとなる。"}, {"id": "c4_s6", "page": "p.71", "number": 6, "statement": "GDPの推計に当たっては、民間の経済活動の把握を重視しているために、公営の地下鉄やバスなどのいわゆる公的企業の経済活動は算入されているが、政府や地方公共団体の経済活動は原則として除かれている。", "answer": false, "explanation": "誤り。政府や地方公共団体も重要な経済主体（政府サービス生産者）として、その経済活動（公務員の給与等）はGDPに算入される。"}, {"id": "c4_s7", "page": "p.71", "number": 7, "statement": "海が工場排水で汚れたので、工場が排水処理施設の建設費用を支出した場合、その金額はGDPに含まれる。", "answer": true, "explanation": "正しい。公害防止設備や復旧のための支出であっても、市場を通じて財やサービスが購入されればGDPに算入される。"}, {"id": "c4_s8", "page": "p.71", "number": 8, "statement": "GDPの算定に当たっては、国内生産物の輸出分と海外生産物の輸入分がいずれも対象外とされているが、これは国内の経済規模を正確に把握するための措置である。", "answer": false, "explanation": "誤り。国内で生産された輸出分はGDPに含まれ、海外で生産された輸入分は控除される（純輸出＝輸出－輸入が計上される）。"}, {"id": "c4_s9", "page": "p.71", "number": 9, "statement": "一人当たりGDPは、国連が後発開発途上国の定義に使用するなど、経済的な豊かさの国際比較で使用されている。", "answer": true, "explanation": "正しい。1人当たりGDP/GNIは各国の経済水準や豊かさを比較する指標として国際機関で広く用いられている。"}, {"id": "c4_s10", "page": "p.72", "number": 1, "statement": "経済成長率はGDP（国内総生産）やGNP（国民総生産）の伸び率で表される。", "answer": true, "explanation": "正しい。経済成長率は一般にGDP（またはGNP）の対前年比の増加率（伸び率）で表される。"}, {"id": "c4_s11", "page": "p.72", "number": 2, "statement": "ある国で海外から受け取った純所得が増加すれば、その国のGDPは増加しないが、GNPは増加する。", "answer": true, "explanation": "正しい。海外からの純所得はGDPには含まれないが、GNP（＝GDP＋海外からの純所得）には含まれるため増加する。"}, {"id": "c4_s12", "page": "p.72", "number": 3, "statement": "国内で外資系企業の生産した財・サービスの価値総額が増加すれば、その国のGDPは増加しないが、GNPは増加する。", "answer": false, "explanation": "誤り。国内での生産なので「GDPが増加」し、利益が本国に送金されればその国の「GNPには加算されない」。"}, {"id": "c4_s13", "page": "p.72", "number": 4, "statement": "ある国で輸出額よりも輸入額が増加すれば、その国のGDPは増加しないが、GNPは増加する。", "answer": false, "explanation": "誤り。輸入額の増加は純輸出（輸出－輸入）を減らし、GDP・GNPともに減少要因となる。"}, {"id": "c4_s14", "page": "p.72", "number": 5, "statement": "国内でボランティア活動が増加すれば、その国のGDPは増加しないが、GNPは増加する。", "answer": false, "explanation": "誤り。ボランティア活動は市場で対価が支払われない無償活動であるため、貨幣価値で換算できずGDPにもGNPにも含まれない。"}, {"id": "c4_s15", "page": "p.72", "number": 6, "statement": "国内総生産（GDP）、国民総生産（GNP）、国民所得（NI）には、環境破壊を引き起こしたり、修復したりする経済活動により発生する付加価値が含まれるが、家事労働の評価額は含まれない。", "answer": true, "explanation": "正しい。現行のGDP/GNP/NIでは修復等の市場活動は含まれるが、専業主婦などの無償の家事労働は市場で取引されないため含まれない。"}, {"id": "c4_s16", "page": "p.72", "number": 7, "statement": "NNW（国民純福祉）は、GNPやNIの概念を修正し、補完するものであり、例えば、環境汚染などの貨幣的評価額は差し引かれ、家事労働や余暇時間などの貨幣的評価額が加算されている。", "answer": true, "explanation": "正しい。NNWはGNPから公害などの損失を控除し、家事労働や余暇の価値を加算して真の豊かさを測ろうとする指標である。"}, {"id": "c4_s17", "page": "p.72", "number": 8, "statement": "日本の国民所得に占める社会保障給付費の割合は、先進諸国の中で最も高い。", "answer": false, "explanation": "誤り。日本の社会保障給付費の割合は高齢化に伴い上昇しているが、北欧諸国やフランス・ドイツなどのヨーロッパ諸国の方が依然として高い。"}, {"id": "c4_s18", "page": "p.72", "number": 9, "statement": "国民所得を「生産」、「分配」、「消費」の三面からみると、すべて等価となる。", "answer": false, "explanation": "誤り。三面等価の原則は「生産国民所得」「分配国民所得」「支出国民所得」の3面であり、「消費」ではなく「支出」である。"}, {"id": "c4_s19", "page": "p.72", "number": 10, "statement": "名目経済成長率がマイナスの場合、そのマイナス成長率よりも物価水準の下落率が大きければ、実質経済成長率はマイナスとなる。", "answer": false, "explanation": "誤り。実質経済成長率≒名目成長率－物価上昇率。物価の下落率（デフレ率）が名目のマイナス率を上回れば、実質成長率は「プラス」になる。"}, {"id": "c4_s20", "page": "p.72", "number": 11, "statement": "市場で取引されない環境破壊による損失は、GDPに計上されない。", "answer": true, "explanation": "正しい。市場取引を介さない環境破壊や公害の被害額はGDPからは控除・計上されない。"}, {"id": "c4_s21", "page": "p.73", "number": 1, "statement": "資本主義経済のもとでは、一般に経済は好況・後退・不況・回復の4つの景気局面を繰り返しながら発展する。", "answer": true, "explanation": "正しい。景気循環は一般に好況（拡張期）→後退期→不況（収縮期）→回復期の4局面を繰り返す。"}, {"id": "c4_s22", "page": "p.73", "number": 2, "statement": "周期的に繰り返される景気変動は、景気循環と呼ばれるが、景気循環の一周期は、最も長いものでも10年程度とされる。", "answer": false, "explanation": "誤り。景気循環のうちコンドラチェフの波は約50〜60年、クズネッツの波は約20年であり、10年程度が最長ではない。"}, {"id": "c4_s23", "page": "p.73", "number": 3, "statement": "好況期に入って上昇するはずの物価が、逆に市場の寡占状態のために下落し続けるという現象を、スタグフレーションと呼ぶ。", "answer": false, "explanation": "誤り。スタグフレーションとは、不況（景気停滞）下であるにもかかわらず物価が持続的に上昇する現象である。"}, {"id": "c4_s24", "page": "p.73", "number": 4, "statement": "不況期の金融政策としては、公開市場操作の一つである買いオペレーションが選ばれることが多い。", "answer": true, "explanation": "正しい。買いオペレーションにより市場に資金を供給し、金利を引き下げて景気刺激を図る。"}, {"id": "c4_s25", "page": "p.73", "number": 5, "statement": "景気の回復期には、経営を立て直そうとする多くの企業がいっせいに値下げ競争を展開するため、物価は一般に他の時期に比べて最も低くなる。", "answer": false, "explanation": "誤り。物価が最も低くなるのは不況の底（谷）であり、景気回復期には需要の増加に伴い物価は上昇傾向に転じる。"}, {"id": "c4_s26", "page": "p.73", "number": 6, "statement": "1954年から、民間設備投資ブームにより神武景気と呼ばれる好景気となったが、やがて「なべ底不況」となった。", "answer": true, "explanation": "正しい。神武景気（1954〜1957）の後に国際収支の悪化から金融引き締めが行われ、なべ底不況（1957〜1958）となった。"}, {"id": "c4_s27", "page": "p.73", "number": 7, "statement": "高度経済成長期の時代には、神武景気→オリンピック景気→岩戸景気→いざなぎ景気という順番に好景気となった。", "answer": false, "explanation": "誤り。正しい順序は、神武景気（54〜57）→岩戸景気（58〜61）→オリンピック景気（62〜64）→いざなぎ景気（65〜70）である。"}, {"id": "c4_s28", "page": "p.73", "number": 8, "statement": "高度経済成長期の中で最長の好景気であるいざなぎ景気の時代に、自動車・クーラー・カラーテレビの「新三種の神器」を中心とした消費ブームがおこった。", "answer": true, "explanation": "正しい。いざなぎ景気（57か月間）期には、3C（自動車、クーラー、カラーテレビ＝新三種の神器）の普及が進んだ。"}, {"id": "c4_s29", "page": "p.73", "number": 9, "statement": "年率数%程度で物価がじわじわと上昇するインフレを、クリーピング・インフレという。", "answer": true, "explanation": "正しい。緩やかに持続的に進むインフレ（忍び寄るインフレ）をクリーピング・インフレ（歩行インフレ）という。"}, {"id": "c4_s30", "page": "p.73", "number": 10, "statement": "デフレになると、貨幣価値が下がるので、年金生活者は生活が苦しくなる。", "answer": false, "explanation": "誤り。デフレでは物価が下落し貨幣価値が「上がる」ため、名目額が固定された年金受給者や預貯金生活者には有利となる。"}, {"id": "c4_s31", "page": "p.73", "number": 11, "statement": "デフレーションの下では、債務を抱える企業や家計にとって債務返済の負担は重くなる。", "answer": true, "explanation": "正しい。物価下落により実質的な貨幣価値が上昇するため、固定額の借金を抱える債務者の実質負担は重くなる。"}, {"id": "c4_s32", "page": "p.73", "number": 12, "statement": "自国通貨の為替相場の下落は、国内の物価を引き下げる効果をもたらす。", "answer": false, "explanation": "誤り。自国通貨安（円安）は輸入原材料やエネルギーの輸入価格を押し上げるため、国内物価を「引き上げる（インフレ）」効果をもたらす。"}]}, {"id": "cat5", "title": "金融とそのしくみ / 日本銀行の役割と金融政策", "page_range": "p.74〜76", "questions": [{"id": "c5_q1", "number": 1, "theme": "貨幣の機能", "source": "政経プレテスト", "question_text": "貨幣にはさまざまな機能がある。そのうち貨幣の価値貯蔵機能の例として最も適当なものを、次の①〜④のうちから一つ選べ。", "options": ["税金を納めるために貨幣を使用する。", "購買力を保つために貨幣を用いる。", "商品の取引を仲立ちするために貨幣を使用する。", "商品の価値を測るために貨幣を用いる。"], "correct_answer": 2, "explanation": "正解：②\n価値貯蔵機能とは、等価の商品といつでも交換できる価値を貯蔵する（購買力を保つ）機能のことである。\n①③は交換の媒介機能、④は価値尺度機能。"}, {"id": "c5_q2", "number": 2, "theme": "貨幣", "source": "政経本試", "question_text": "貨幣に関連する記述として正しいものを、次の①〜④のうちから一つ選べ。", "options": ["貨幣には、取引の仲立ちを行う価値貯蔵手段としての機能がある。", "マネーストックとは、中央政府が保有する貨幣残高のことである。", "管理通貨制度の下では、通貨発行量は中央銀行の保有する金の量によって制限されない。", "預金通貨は、財・サービスの対価の支払手段として用いられることはない。"], "correct_answer": 3, "explanation": "正解：③\n③正しい 金本位制の下で発行される通貨（金と交換できる兌換紙幣）の発行量は中央銀行の金保有量に制約されたが、管理通貨制度の下で発行される通貨（不換紙幣）は金保有量によって制限されない。\n①誤り 取引の仲立ちを行う機能は「交換手段（交換の媒介手段）」。\n②誤り マネーストックとは、金融機関や中央政府以外の経済主体（企業、家計、地方自治体等）が保有する通貨量の総量。\n④誤り 普通預金や当座預金などの「預金通貨」は、小切手や口座振替などを通じて財・サービスの支払手段として広く用いられている。"}, {"id": "c5_q3", "number": 3, "theme": "管理通貨制", "source": "政経本試", "question_text": "金本位制と比べた管理通貨制の特徴についての記述として最も適当なものを、次の①〜④のうちから一つ選べ。", "options": ["通貨政策において、国際協力や国際協定の締結を行う必要がなくなった。", "金準備に拘束されることなく、国内の金融政策の発動が可能になった。", "国際商取引を、自国通貨により最終的に決済することが常態となった。", "兌換銀行券が流通して、インフレーションが激しくなった。"], "correct_answer": 2, "explanation": "正解：②\n②適当 管理通貨制では中央銀行が金の保有量に拘束されず、国内の景気動向に応じて弾力的に金融政策を行うことができる。\n①不適当 各国の為替相場安定のためにむしろ国際的な金融協調が必要となった。\n③不適当 国際決済は米ドルなどの基軸通貨による決済が一般的である。\n④不適当 管理通貨制のもとで流通するのは金との兌換ができない不換紙幣（不換銀行券）である。"}, {"id": "c5_q4", "number": 4, "theme": "金融", "source": "政経, 倫理・政経本試", "question_text": "金融についての記述として正しいものを、次の①〜④のうちから一つ選べ。", "options": ["日本では、家計の金融資産のうち現金・預金の占める割合が最も大きい。", "日本では、グローバル化をうけて直接金融から間接金融への移行が進んでいる。", "ノンバンクとは、預金業務と貸出業務を行う金融機関である。", "信用創造とは、企業が金融機関に債務を滞りなく返済することで追加的な資金調達が可能になることをいう。"], "correct_answer": 1, "explanation": "正解：①\n①正しい 日本では家計金融資産の5割以上を現金・預金が占めている。\n②誤り 日本では従来の間接金融（銀行借入）中心から、証券市場を通じた直接金融（株式・社債）の活用へと移行が進められている。\n③誤り ノンバンク（消費者金融、信販会社など）は預金業務を行わず、貸出（融資）のみを行う金融機関である。\n④誤り 信用創造とは、銀行が受け入れた預金から支払準備金を差し引いた残額を貸し出すことを連鎖的に繰り返すことで、預金通貨を何倍にも膨らませる機能のこと。"}, {"id": "c5_q5", "number": 5, "theme": "金融", "source": "政経, 倫理・政経本試", "question_text": "金融に関連する記述として誤っているものを、次の①〜④のうちから一つ選べ。", "options": ["デリバティブは、株式や債券から派生した金融商品で先物取引やオプション取引がある。", "ヘッジファンドによる短期の国際的な資金移動は、為替レートを変動させる要因となる。", "日本銀行の量的緩和政策は、金融政策の主たる誘導目標を政策金利として金融緩和を進めようとするものである。", "日本の短期金融市場には、金融機関がごく短期間の貸借で資金の過不足を調整するコール市場がある。"], "correct_answer": 3, "explanation": "正解：③\n③誤り 量的緩和政策とは、金利を誘導目標とする伝統的な金融政策と異なり、日本銀行の「当座預金残高」という資金の量そのものを誘導目標として市場に潤沢な資金を供給する政策である。\n①②④は正しい。"}, {"id": "c5_q6", "number": 6, "theme": "日本銀行", "source": "政経追試", "question_text": "日本銀行についての記述として誤っているものを、次の①〜④のうちから一つ選べ。", "options": ["日本銀行は、発行した日本銀行券と金との交換を保証している。", "日本銀行は、金融政策を通じて物価の安定を図る。", "日本銀行は、「最後の貸し手」として金融システムの安定を図る。", "日本銀行は、「政府の銀行」として国庫金の管理を行う。"], "correct_answer": 1, "explanation": "正解：①\n①誤り 現在の管理通貨制度の下では、日本銀行券は金との交換が保証されていない不換紙幣である。\n②③④は日本銀行の重要な機能として正しい。"}, {"id": "c5_q7", "number": 7, "theme": "信用創造", "source": "政経本試", "question_text": "次の表のように、銀行Aが2,000万円の預金（本源的預金）を受け入れ、支払準備率を20パーセントとして企業に貸し出すとする。この貸出金は、企業の取引の支払いに充てられ、支払いを受けた別の企業によって銀行Bに全額、預金されるとする。銀行Bはこの預金をもとに企業への貸出しを行い、同様の過程を経て、銀行Cに預金がなされる。銀行の支払準備率をすべて20パーセントで一定とすると、この過程が次々と繰り返された場合、信用創造で作り出された銀行全体の預金の増加額として正しいものを、次の①〜④のうちから一つ選べ。", "material": {"type": "table_html", "content": "<div class=\"my-2 max-w-md mx-auto text-xs\">\n  <table class=\"w-full text-center border-collapse border border-slate-300 bg-white\">\n    <thead>\n      <tr class=\"bg-slate-100\">\n        <th class=\"border border-slate-300 p-1\">銀行</th>\n        <th class=\"border border-slate-300 p-1\">預金</th>\n        <th class=\"border border-slate-300 p-1\">支払準備金</th>\n        <th class=\"border border-slate-300 p-1\">貸出金</th>\n      </tr>\n    </thead>\n    <tbody>\n      <tr>\n        <td class=\"border border-slate-300 p-1 font-semibold\">A</td>\n        <td class=\"border border-slate-300 p-1\">2,000万円</td>\n        <td class=\"border border-slate-300 p-1\">400万円</td>\n        <td class=\"border border-slate-300 p-1\">1,600万円</td>\n      </tr>\n      <tr>\n        <td class=\"border border-slate-300 p-1 font-semibold\">B</td>\n        <td class=\"border border-slate-300 p-1\">1,600万円</td>\n        <td class=\"border border-slate-300 p-1\">320万円</td>\n        <td class=\"border border-slate-300 p-1\">1,280万円</td>\n      </tr>\n      <tr>\n        <td class=\"border border-slate-300 p-1 font-semibold\">C</td>\n        <td class=\"border border-slate-300 p-1\">1,280万円</td>\n        <td class=\"border border-slate-300 p-1\">256万円</td>\n        <td class=\"border border-slate-300 p-1\">1,024万円</td>\n      </tr>\n      <tr>\n        <td class=\"border border-slate-300 p-1 font-semibold\" colspan=\"4\">︙</td>\n      </tr>\n    </tbody>\n  </table>\n</div>"}, "options": ["4,000万円", "4,880万円", "8,000万円", "9,600万円"], "correct_answer": 3, "explanation": "正解：③\n信用創造で作り出された銀行全体の「預金の増加額」は、\n預金総額－本源的預金 で求められる。\n預金総額＝本源的預金÷支払準備率 ＝ 2,000万円÷0.2 ＝ 1億円。\nしたがって預金の増加額（信用創造額）は、\n1億円－2,000万円 ＝ 8,000万円 となる。"}, {"id": "c5_q8", "number": 8, "theme": "金融政策", "source": "政経, 倫理・政経本試", "question_text": "生徒Xは、日本国債の保有者の構成比について関心をもった。そこでXは、2011年3月と2021年3月における日本国債の保有者構成比および保有高を調べ、次の図を作成した。図に示された構成比の変化に関する記述として最も適当なものを、次の①〜④のうちから一つ選べ。", "material": {"type": "chart_comparison", "content": "<div class=\"my-2 p-3 bg-slate-50 border rounded text-xs text-slate-800\">\n  <div class=\"font-bold text-center mb-2\">【日本国債の保有者構成比の推移】</div>\n  <div class=\"grid grid-cols-1 md:grid-cols-2 gap-4\">\n    <div class=\"border p-2 rounded bg-white\">\n      <div class=\"font-bold text-center text-blue-700\">2011年3月 (総額 733兆7,616億円)</div>\n      <ul class=\"mt-1 space-y-0.5\">\n        <li>・預金取扱機関： 42.3%</li>\n        <li>・保険・年金基金： 25.1%</li>\n        <li>・公的年金： 10.5%</li>\n        <li class=\"font-semibold text-rose-600\">・日本銀行： 8.2%</li>\n        <li>・その他： 5.6%</li>\n        <li>・家計： 4.1%</li>\n        <li>・海外： 4.1%</li>\n      </ul>\n    </div>\n    <div class=\"border p-2 rounded bg-white\">\n      <div class=\"font-bold text-center text-blue-700\">2021年3月 (総額 1,044兆2,994億円)</div>\n      <ul class=\"mt-1 space-y-0.5\">\n        <li class=\"font-bold text-rose-600 text-sm\">・日本銀行： 48.4% (激増)</li>\n        <li>・保険・年金基金： 23.8%</li>\n        <li>・預金取扱機関： 12.5%</li>\n        <li>・海外： 13.7%</li>\n        <li>・その他： 3.7%</li>\n        <li>・公的年金： 3.5%</li>\n        <li>・家計： 1.3%</li>\n      </ul>\n    </div>\n  </div>\n  <div class=\"text-[10px] text-slate-500 mt-2 text-right\">(出所) 日本銀行Webページにより作成。</div>\n</div>"}, "options": ["日本銀行の金融引締め政策を反映しており、日本銀行が日本政府の発行した国債を直接引き受けた結果である。", "日本銀行の金融緩和政策を反映しており、日本銀行が民間金融機関から国債を購入した結果である。", "日本銀行の金融引締め政策を反映しており、日本銀行が民間金融機関に国債を売却した結果である。", "日本銀行の金融緩和政策を反映しており、日本銀行が日本政府の発行した国債を直接引き受けた結果である。"], "correct_answer": 2, "explanation": "正解：②\n近年、日本銀行は大規模な金融緩和政策（異次元緩和）を継続し、民間金融機関から大量の国債を買い入れた（買いオペレーション）ため、日本銀行の国債保有比率が急増している。\nなお、日本銀行が政府から直接国債を引き受けること（直接引き受け）は、財政法第5条により原則として禁止されている。"}, {"id": "c5_q9", "number": 9, "theme": "金融政策", "source": "政経追試", "question_text": "日本銀行が行う金融政策についての記述として最も適当なものを、次の①〜④のうちから一つ選べ。", "options": ["日本銀行が行う金融政策は、財政政策などとのポリシー・ミックスの観点から、憲法上国会の議決を必要としている。", "日本銀行が行う金融政策は、金融制度に備わっている、景気の自動安定装置（ビルトイン・スタビライザー）を利用して行われている。", "預金準備率操作は、金融引締めのために準備率の引下げを行い、金融緩和のために準備率の引上げを行うものである。", "公開市場操作は、金融引締めのために売りオペレーションを行い、金融緩和のために買いオペレーションを行うものである。"], "correct_answer": 4, "explanation": "正解：④\n④適当 金融引締めは市中の通貨量を減らすために売りオペ（国債等を売却）を行い、金融緩和は市中の通貨量を増やすために買いオペ（国債等を購入）を行う。\n①不適当 日本銀行の政策決定会合において自主的に決定される（国会の議決は不要）。\n②不適当 ビルトイン・スタビライザーは累進課税や社会保障制度など財政制度に備わる機能である。\n③不適当 金融引締めでは準備率を引き上げ、金融緩和では引き下げる。"}, {"id": "c5_q10", "number": 10, "theme": "金融政策", "source": "政経, 倫理・政経追試", "question_text": "中央銀行が実施する政策や業務についての記述として正しいものを、次の①〜④のうちから一つ選べ。", "options": ["デフレーション対策として、国債の売りオペレーションを行う。", "自国通貨の為替レートを切り下げるために、外国為替市場で自国通貨の売り介入を行う。", "金融緩和政策として、政策金利を高めに誘導する。", "金融機関による企業への貸出しを増やすために、預金準備率を引き上げる。"], "correct_answer": 2, "explanation": "正解：②\n②正しい 為替レートを切り下げる（円安に誘導する）ためには、市場で自国通貨を売り、外国通貨を買う（円売り・ドル買い介入）を行う。\n①誤り デフレ対策（金融緩和）には買いオペレーションを行う。\n③誤り 金融緩和政策では政策金利を低めに誘導する。\n④誤り 企業への貸出しを増やすには預金準備率を引き下げる。"}, {"id": "c5_q11", "number": 11, "theme": "日本の金融", "source": "政経, 倫理・政経本試", "question_text": "日本の金融機関についての記述として誤っているものを、次の①〜④のうちから一つ選べ。", "options": ["日本銀行は、市中銀行に対して貸出しを行うことができる。", "市中銀行は、コール市場で相互に短期資金を融通し合うことができる。", "証券会社は、有価証券の売買ができるが、その引受けはできない。", "ノンバンクは、貸出しができるが、預金の受入れはできない。"], "correct_answer": 3, "explanation": "正解：③\n③誤り 証券会社は有価証券の売買（ブローカー・ディーラー業務）だけでなく、企業が発行する新株や社債の「引受け・売出し（アンダーライティング業務）」も主要業務として行っている。\n①②④は正しい。"}, {"id": "c5_q12", "number": 12, "theme": "金融システム", "source": "政経本試", "question_text": "金融の仕組みや制度についての記述として最も適当なものを、次の①〜④のうちから一つ選べ。", "options": ["BIS規制では、国内業務のみを行う銀行は、国際業務を行う銀行よりも、高い自己資本比率が求められている。", "日本のペイオフ制度では、金融機関が破綻した場合に、預金保険機構によって、預金の元本のみが全額払戻される。", "銀行による信用創造で創出される預金額は、資金の需要が一定であるならば、支払準備率が小さいほど大きくなることができる。", "企業が社債を発行することにより、金融市場で資金調達を行うことは、間接金融の方式に当たる。"], "correct_answer": 3, "explanation": "正解：③\n③適当 信用創造により創出される預金総額＝本源的預金×(1÷支払準備率) なので、支払準備率が小さいほど創出される預金額は大きくなる。\n①不適当 国際業務を行う銀行は8%以上、国内業務のみの銀行は4%以上と定められている。\n②不適当 ペイオフでは1金融機関につき預金者1人当たり元本1,000万円までとその利息が保護される（決済用預金は全額保護）。\n④不適当 社債発行による資金調達は直接金融である。"}, {"id": "c5_q13", "number": 13, "theme": "金融規制の緩和", "source": "政経第1回", "question_text": "1980年代から、自由な金融市場の発展を促すため、先進国での金融規制の緩和は珍しくなくなった。そうした動きに関連した日本の銀行制度に関する次の記述アとイの正誤の組合せとして正しいものを、次の①〜④のうちから一つ選べ。\n\nア 日本銀行は、バブル経済崩壊後、国債を市場で売買することにより市場金利への影響力を行使したことはない。\nイ 日本版金融ビッグバン以前は、経営基盤の弱い銀行も規制や保護により利益を確保できたため、流通業など他業種から銀行業への参入が増えていた。", "options": ["ア 正　イ 正", "ア 正　イ 誤", "ア 誤　イ 正", "ア 誤　イ 誤"], "correct_answer": 4, "explanation": "正解：④\nア…誤り。バブル崩壊後も日銀は国債売買（公開市場操作）を通じて超低金利政策やゼロ金利政策、量的緩和など市場金利への影響力を行使してきた。\nイ…誤り。日本版金融ビッグバン以前は「護送船団方式」により保護されていたが、銀行業への新規参入は厳しく規制されていた。流通業（セブン銀行など）やIT企業など異業種からの参入が進んだのはビッグバン以降である。"}, {"id": "c5_q14", "number": 14, "theme": "金融の自由化・国際化", "source": "政経本試", "question_text": "日本における金融の自由化・国際化についての記述として誤っているものを、次の①〜④のうちから一つ選べ。", "options": ["アメリカを中心とする外国の銀行が日本へ進出するとともに、大手銀行どうしの合併など、金融業界の再編も進んだ。", "投資家による自由な資金運用の促進を目的として、銀行と証券の業務分野が二分化された。", "市中銀行が、預金金利を自由に設定できるようになっている。", "金融機関以外の一般企業が、銀行業などに参入するようになった。"], "correct_answer": 2, "explanation": "正解：②\n②誤り 日本版金融ビッグバンなどの金融改革では、従来の銀行・信託・証券の垣根を取り払い、子会社方式による相互参入など「相互乗り入れ」が進められた（二分化ではない）。\n①③④は正しい。"}], "speed_checks": [{"id": "c5_s1", "page": "p.74", "number": 1, "statement": "現金通貨には、日本銀行券のほかに小切手が含まれる。", "answer": false, "explanation": "誤り。現金通貨は日本銀行券（紙幣）と政府発行の硬貨（貨幣）であり、小切手は預金通貨である。"}, {"id": "c5_s2", "page": "p.74", "number": 2, "statement": "預金通貨には、要求払い預金である普通預金などが含まれる。", "answer": true, "explanation": "正しい。当座預金や普通預金などの要求払い預金は預金通貨に含まれる。"}, {"id": "c5_s3", "page": "p.74", "number": 3, "statement": "金本位制度では、通貨供給量は中央銀行の保有する金の量に制約される。", "answer": true, "explanation": "正しい。金本位制では金準備の範囲内でしか兌換紙幣を発行できない。"}, {"id": "c5_s4", "page": "p.74", "number": 4, "statement": "管理通貨制度では、市中銀行が、買いオペレーションなど公開市場操作を行うことにより通貨供給量を増減させる。", "answer": false, "explanation": "誤り。公開市場操作を行うのは中央銀行（日本銀行）である。"}, {"id": "c5_s5", "page": "p.74", "number": 5, "statement": "日本は、第二次世界大戦の終結とともに、金本位制度から離脱した。", "answer": false, "explanation": "誤り。日本が金本位制（金輸出解禁）から完全に離脱したのは1931年（昭和恐慌期）である。"}, {"id": "c5_s6", "page": "p.74", "number": 6, "statement": "ニクソン政権下で金・ドル交換停止が行われたことを契機に、日本は管理通貨制度を採用した。", "answer": false, "explanation": "誤り。戦前から断続的に管理通貨制度が採用され、戦後は常に管理通貨制度であった。"}, {"id": "c5_s7", "page": "p.74", "number": 7, "statement": "株式や国債などの証券を発行して資金を集める金融のやり方を直接金融という。", "answer": true, "explanation": "正しい。証券市場を通じて資金の借り手が貸し手から直接調達する方法を直接金融という。"}, {"id": "c5_s8", "page": "p.74", "number": 8, "statement": "証券会社も間接金融を行っている。", "answer": true, "explanation": "正しい。証券会社が扱う投資信託は、多数の投資家から集めた資金をまとめて運用する仕組みであり、一般に間接金融に分類される。（解答解説P.35参照）"}, {"id": "c5_s9", "page": "p.74", "number": 9, "statement": "企業が社債発行や銀行借り入れによって調達した資本を自己資本という。", "answer": false, "explanation": "誤り。社債発行や借入金による調達資金は他人資本（負債）である。自己資本は株式発行や内部留保。"}, {"id": "c5_s10", "page": "p.74", "number": 10, "statement": "預金通貨は、政府の信用創造によって供給される。", "answer": false, "explanation": "誤り。信用創造を行うのは市中
